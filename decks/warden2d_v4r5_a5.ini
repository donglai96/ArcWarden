# V4R5-A5 — sparse-storage shakedown + excitation test (user 2026-08-18):
# same compact dipole2d geometry as V4R4 (x_min 2500, band [3300,4700],
# dL=60 shell >= 5.5 whistler wavelengths), but A = 5 (uthperp = sqrt(6) x
# 0.141 = 0.345) for a SHORT run whose only questions are:
#   1. initial density sits exactly on the designed shell (dens_init map),
#   2. whistlers are excited fast and chirping is visible in the
#      spectrograms (A=5 drive: growth in hundreds of Omega_e^-1),
#   3. wave maps (f2d every 5000) show propagation along the lines inside
#      the active band, absorbed at the band edge and the box frame.
# NOT a production arm: A=5 is the excitation stress test; the A-ladder
# toward realistic anisotropy stays the pre-registered production plan.
# rel = 1 mandatory at A = 5 (V4R2 lesson: nonrel tail runs away).

[domain]
lam_w_deg = 50
x_min     = 2500
active_Lmin = 3300
active_Lmax = 4700
margin    = 60
dx = 0.25
dz = 0.25

[background]
profile = dipole2d
B0eq    = 0.2
L0      = 4000

[time]
dt     = 0.15
nsteps = 60000

[cold]
nc = 0.99
c  = 1.0
nonlinear = 0

[boundary]
absorber_cells = 240
runway_lam_deg = 25

[diag]
target_band_max = 0.75
target_wna_deg  = 45
target_lam_deg  = 20
snap_every      = 5000
energy_every    = 250
probe_every     = 4
fv_every        = 20000
dens_init       = 1

[species engine]
deltaf   = 0
rel      = 1
dist     = 0
n0       = 0.010
uthpar   = 0.141
uthperp  = 0.345
shell_L0 = 4000
shell_dL = 60
ppc      = 100

# G2.1 — Li/Bortnik/An 2019 Nat. Commun. two-band setup, ArcWarden SPECTRAL DARWIN twin (grid-heating control arm).
# 1D box tilted 15 deg from B0 (their imposed wave-normal angle), uniform B,
# periodic, ALL-PIC (no cold fluid: the 10-eV cold component must be kinetic
# to Landau-resonate). Their numbers: 1024 cells, dz = 0.05 c/wpe,
# dt = 0.032/wpe (we take 0.02 for CFL margin), fpe/fce = 5,
# cold 80% kappa=4 vT=0.01c isotropic; warm 20% kappa=1.5,
# vT_par = 0.02c, vT_perp = 0.04c (Tperp/Tpar = 4). Anisotropy is theirs
# (boosted vs observations "to speed up wave growth" — replication first).
# Runner: ./liband_yee <this> <outdir>
# Expected (their Fig. 2-4): broadband whistler growth, Landau plateau at
# vpar ~ +-Vp(0.1-0.11c), band splitting near 0.5 fce by t*fce ~ few hundred.

[grid]
nx = 1024
ny = 1
Lx = 51.2
Ly = 0.05

[time]
dt = 0.05
nsteps = 157100      # 1000 tau_gyro = 31420/wpe at dt=0.2

[field]
model = darwin
dx_wpe_c = 0.05
ndc = 2
tile_sort = 25

[plasma]
qm = -1.0
rel = false
noisy = true
seed = 20260722

[background]
wce = 0.2
theta_deg = 15.0

[species cold]
density = 0.8
ppc = 4000
uth = 0.01 0.01 0.01
kappa_v = 4.0

[species warm]
density = 0.2
ppc = 4000
uth = 0.02 0.04 0.04
kappa_v = 1.5

[diagnostics]
probes = 12.8 25.6 38.4

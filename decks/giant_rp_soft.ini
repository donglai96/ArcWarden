# SOFT-vs-HARD TEST vs giant_rp_wide: same 300-cell precip layer, but the u_perp
# removal is now the hybrid-style depth-graded exp fold (uy *= exp(-numax*dt*d^2),
# d = strip depth 0->1) instead of the instant HARD zero. Hypothesis: the hard
# zero cools the mid-lat amplifier (returning cold beam) -> kills convective gain
# (wide profile is FLAT, gain 1.1x vs hybrid/1-cell 3.4x) -> element stuck at the
# equator (0.96x B_th). The soft fold keeps mid-lat particles warm -> should
# RESTORE convective gain -> element grows eq->15deg toward hybrid's 3.6x.
# Everything else identical to giant_rp_wide (seed, scale, ppc, refresh@15, 300-cell).

[grid]
nx = 5000
ny = 1
Lx = 1300.0
Ly = 0.26

[time]
dt = 0.15
nsteps = 83334          # t_end = 2500/We0

[field]
model = yee
jfilter = 3
tile_sort = 25

[plasma]
qm = -1.0
cold_nc = 0.9822
rel = true
noisy = true
seed = 20260720

[background]
wce = 0.2
profile = dipole
lre = 1330.504

[boundary]
x = damping
nd = 300
numax = 0.1

[antenna]
amp = 0.0

[species hot]
density = 0.0178
ppc = 110000
uth = 0.19783565 0.24390817 0.24390817
rep = fullf
dist = losscone
rho = 1.0
kappa = 0.3

[diagnostics]
# lat:     -25    -20    -15    -12.5  -10    -7.5   -5     -2.5  0
probes = -609.1 -480.4 -355.6 -294.6 -234.5 -175.1 -116.4 -58.1 0.0 58.1 116.4 175.1 234.5 294.6 355.6 480.4 609.1

[refresh]
enable = true
lambda_deg = 15.0
shell = 15.0
precip = true
precip_cells = 300.0
precip_soft = true       # <-- THE CHANGE: hard zero -> soft depth-graded exp fold
precip_numax = 0.1       # match hybrid bnd_numax

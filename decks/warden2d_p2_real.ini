# P2-REAL — real-scale source-region run (docs/RUNCARD_REALSCALE_SOURCE.md).
# L0 = 18780 -> lre_eff = sqrt(1.5)*L0 = 23000 c/wpe = REAL L=5 (wpe/We=5).
# Only the +-10 deg equatorial source region is simulated; the +-10 deg
# particle wall (mirror ratio 1.05) acts as an instant-mirror-return
# approximation (documented risk R2). At real lre the two compressed-geometry
# blockers vanish: B_th(0.3) ~ 4e-8 (any injected packet is deep inside the
# Omura corridor) and transverse walk-off is 17x slower than P1.
# Representation: DELTA-F (quiet floor; full-f shot noise >> B_th would
# flood every channel at once) + ANTENNA trigger (delta-f has no spontaneous
# emission - here that is the feature). No prebalance needed: delta-f
# deposits no f0 magnetization current, the dent never forms.
# amp set by A-cal 2026-08-19: target dB = 1e-3 B0eq = 2e-4 absolute at the
# equator after ramp.
#
# FROZEN EXPECTATIONS (design doc E1-E4):
#   E1 packet locks after toff and sweeps UP (ridge monotone >= 3 independent
#      frequency cells over >= 1000/We);
#   E2 sweep rate ~ Omura at this Bw and real a (factor 2);
#   E3 wd_rms < 0.25 throughout;
#   E4 delta-f background self-oscillation stays below the element until the
#      main sweep completes (risk R1; wdnoise = 1e-5 buys ~11000/wpe).
# Runner: ./build/warden2d decks/warden2d_p2_real.ini build/p2_real \
#             --nsteps=300000 --ckpt=25000

[domain]
lam_w_deg = 10
x_min     = 17873        # wall latitude 10 deg
active_Lmin = 18580
active_Lmax = 18980
margin    = 60
dx = 0.25
dz = 0.25

[background]
profile = dipole2d
B0eq    = 0.2
L0      = 18780
prebalance = 0           # delta-f: no dent (f0 carries no deposited current)

[time]
dt     = 0.15
nsteps = 300000          # t = 45000/wpe = 9000/We_eq (~1 real-scale element)

[cold]
nc = 0.990
c  = 1.0
nonlinear = 0

[boundary]
absorber_cells = 240
runway_lam_deg = 7

[diag]
target_band_max = 0.75
target_wna_deg  = 45
target_lam_deg  = 8
snap_every      = 5000   # f2d 2.7 GB/frame x 60 = 164 GB; sline every 1250
energy_every    = 100
probe_every     = 4
probe_L2        = 18830  # outer flat-top edge
fv_every        = 20000
fv_vmax         = 0.6
fv_uqmax        = 1.2
dens_init       = 1

[species engine]
deltaf   = 1             # quiet floor for the trigger experiment
rel      = 1
dist     = 0
n0       = 0.010
uthpar   = 0.141
uthperp  = 0.345         # A = 5 (Lu 2019 f0, unchanged)
shell_L0 = 18780
shell_dL = 100           # 10.4 lambda_par
edge_dL  = 10
ppc      = 50           # 44B/marker honest estimate: ppc=60 DOES NOT FIT (audit)
wdnoise  = 1e-5
wdrms_max = 0.25         # E3 enforced by healthy() (audit fix)

[antenna]
amp     = 6e-3           # placeholder - A-CAL REPLACES THIS before launch
w0      = 0.05           # 0.25 We_eq
L0      = 18780
sigma_L = 12
sigma_z = 15
trmp    = 300
toff    = 3000

# LRE bifurcation scan arm x10 (docs/PLAN_LRE_SCAN.md, 2026-08-08 user design):
# ONE-parameter scan of field-line scale lre; everything else IDENTICAL
# across arms: Lu-x10 f0 (nh=0.01 upar=0.141 uperp=0.3454 A=5 bimax,
# NO loss cone), wpe/We=5, dx=0.26, dt=0.15, ppc=72000, x=hybrid nd=300,
# wall MLAT +-26.563deg FIXED (Lx scales with lre), t6000, RSM off.
# Probes at fixed MLAT (positions scale with lre; B0(lam)/Beq lre-free).
# Runner: ./chirp2d <this> <outdir> --ckpt=100000    (eline ON: J.E needs E)

[grid]
nx = 5000
ny = 1
Lx = 1300.0
Ly = 0.26

[time]
dt = 0.15
nsteps = 200000          # t_end = 6000/We0 (phase-3 OFFICIAL length, 2026-08-07 rev; seed20 t4000 was the pilot — s1 resumes from ckpt t3000)

[field]
model = yee
jfilter = 3
tile_sort = 25             # mandatory at ppc=110000

[plasma]
qm = -1.0
cold_nc = 0.990
rel = true
noisy = true
seed = 20260720          # scan pass 1; transition arms get 20260721/22 later (pre-registered)

[background]
wce = 0.2
profile = dipole
lre = 1330.504            # x10 compression; Lx = 2*g(26.563deg)*lre, dx=0.26 fixed

[boundary]
x = hybrid
nd = 300
numax = 0.1

[antenna]
amp = 0.0

[species hot]
density = 0.010
ppc = 72000              # UNIFORM across scan (x4-arm 492M markers ~27GB sets the cap)
uth = 0.141 0.345378 0.345378
rep = fullf
dist = bimax

[diagnostics]
# MLAT: +-{2.5,5,7.5,10,12.5,15,20,25} deg + eq, s = g(lam)*lre
probes = -609.1 -480.4 -355.6 -294.6 -234.5 -175.1 -116.4 -58.1 0.0 58.1 116.4 175.1 234.5 294.6 355.6 480.4 609.1

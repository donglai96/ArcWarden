# G1.3 smoke — mirror2d runner + diagnostics pack shakeout (NOT physics).
# 2D slab mirror (R_wall = 2), cold isotropic majority + warm anisotropic
# minority, production knobs (jfilter, closed x, rho/dy >= 2 for both
# species: rho_cold = 0.08/0.25 = 0.32 = 1.6 dy is WAIVED here — smoke only;
# a physics deck must bump wce down or dy up per test_mirror2d rule 1).
# Runner: ./mirror2d <this> <outdir> --nsteps=4000

[grid]
nx = 1024
ny = 32
Lx = 204.8
Ly = 6.4

[time]
dt = 0.1
nsteps = 20000

[field]
model = yee
jfilter = 3
tile_sort = 25

[plasma]
qm = -1.0
rel = false
noisy = true
seed = 20260723

[background]
wce = 0.25
profile = mirror2d
a = 9.5367431640625e-05      # 1/xc^2, mirror ratio 2 at the x walls

[boundary]
x = damping

[species cold]
density = 0.9
ppc = 100
uth = 0.1 0.1 0.1

[species warm]
density = 0.1
ppc = 200
uth = 0.1 0.14 0.14

[diagnostics]
probes = -51.2 0 51.2   # OFFSETS from b0_xc (P0-2 convention change)

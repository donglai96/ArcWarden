# P4-TRAIN — ARM-2: triggered element TRAIN (discrete rising-tone sequence).
# Launch ONLY after the ARM-1 element_gate verdict; run card to user first.
# [antenna] tper = 2100 (~ element formation+transit from the pilot),
# toff = 600 within each cycle -> 3 trigger pulses in t = 7500/wpe
# (5-pulse version deferred: wdrms budget ~0.25 by t~7500 at element
#  amplitudes; extend by resume after the battery rules on this run).
# amp follows the 1c calibration (3e-4 -> seed ~4e-3 per pulse).
# FROZEN READOUTS:
#   P-C1 each pulse spawns ONE riser (>= 4 of 5) with the P-B2 shape bars;
#   P-C2 inter-element spectral separation: PSD between elements at the
#        birth band drops >= 10x below element-peak PSD;
#   P-C3 validity battery holds (wdrms watch: multi-element scattering
#        accumulates — if the 0.25 rms gate trips, the run's healthy()
#        emergency checkpoint is the verdict point, report as boundary).


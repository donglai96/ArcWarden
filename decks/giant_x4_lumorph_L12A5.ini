# Lu-morph pilot L12A5 (2026-08-06 user plan, docs/PLAN_LUMORPH.md phase 1):
# cold-PARALLEL high-A single population — the knob is u_par DOWN (close the
# low-frequency Omura corridor, push element birth to 0.3-0.4), NOT u_perp up.
# = giant_x4_d120_ctrl.ini with ONE physics delta: uth (0.19783565, 0.31283)
# -> (0.12, 0.294), A = 5. Same box/lre/density/cold_nc/ppc/conecut/seed;
# RSM off, antenna off. t4000/Oe pilot.
# Gate (plan phase 2, ALL required): no A20-style early broadband burst;
# one clear connected rising element; birth 0.28-0.40; sweep >= 0.15;
# crosses 0.55 stable under nwin={1024,1536,2048} (spread < 0.01);
# eq Bw/B0 in [3e-3, 1e-2]; no natural 0.46-0.56 valley; not an isolated
# high-f dot / fake ridge in broadband. Stop rules: broadband burst by
# t2000 -> early FAIL; no clear element by t4000 -> FAIL; a single short
# window touching 0.6 is NOT a pass.
# Runner: ./chirp2d <this> <outdir> --ckpt=100000 --noeline


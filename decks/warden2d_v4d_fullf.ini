# V4d — chirping anchor, FULL-F, dipole2d background (2026-08-18
# realism upgrade: true 3D-dipole meridional line shapes, mirror profile
# within ~5% of the real dipole, Beq ~ L^-3). Successor to V4a.
# Original V4a header follows:
# V4a — chirping anchor, FULL-F arm (user decision 2026-08-17: the
# representation-safe baseline runs FIRST; the delta-f+taud twin (V4b)
# is validated AGAINST it, not assumed). At x10 the full-f shot-noise
# floor (~1.3e-3) sits at B_th — the threshold-gated regime in which the
# 1D lurepro full-f runs produced 4/4-seed risers crossing 0.55; this is
# their direct 2D twin. Charge closure: immobile ions neutralize
# nc + n_h(x,z) at t=0 (E=0 consistent); the anisotropic shell's
# diamagnetic relaxation (~beta_perp/2 ~ 3%) appears as an early
# transient (legacy G1.2 rule 2).
# Original delta-f header follows:
# V4 — chirping anchor (PLAN_2D_REBORN §5): single Lu-morph engine in the
# W10 line dipole. f0 = the lurepro-validated recipe (1D x10, 4/4 seeds
# crossed 0.55): cold-parallel u_par = 0.141c, A = 5 (u_perp = 0.345c),
# n_h = 1% — the low-frequency Omura corridor is shut, elements are born
# at 0.3-0.4 and climb. Shelf OFF: V4 anchors chirping only.
# Pre-registered gates: spatio-temporally connected rising tone at the 5°
# probe (dw >= 0.15 Omega_e,eq), WNA growth with latitude, poleward
# Poynting. Broadband flood = FAIL; the one pre-registered action is
# n0 -> 0.005.
# Runtime: 200k steps (t = 30000/wpe = 6000/Omega_e) at ~40 ms/step ≈ 2.2 h.

[domain]
lam_w_deg = 50
margin    = 60
dx = 0.25
dz = 0.25

[background]
profile = dipole2d
B0eq    = 0.2
L0      = 1330.5

[time]
dt     = 0.15
nsteps = 200000

[cold]
nc = 0.99
c  = 1.0
nonlinear = 0

[boundary]
absorber_cells = 240
runway_lam_deg = 40

[diag]
target_band_max = 0.75
target_wna_deg  = 45
target_lam_deg  = 20
snap_every      = 20000
energy_every    = 500

[species engine]
deltaf   = 0
dist     = 0
n0       = 0.010
uthpar   = 0.141
uthperp  = 0.345
shell_L0 = 1330.5
shell_dL = 40
ppc      = 60
wdnoise  = 1e-3
# (taud: delta-f only; unused in full-f)
                      # Strong-drive chirping arm: without relaxation the
                      # trapped-marker weights grow secularly past |wd|~1
                      # and the deposit runs away (V4 first-run failure at
                      # step 46500). FORBIDDEN in H2 gap-memory arms.

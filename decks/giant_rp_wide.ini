# SINGLE-VARIABLE TEST vs giant_rp_e12: widen the precip u_perp-strip from 1
# cell to 300 cells (= bnd_nd) so the damping+refresh side removes u_perp over
# a layer at lat 22-25 deg, MATCHING the hybrid (bnd_x=2) soft u_perp layer's
# WIDTH. Everything else identical to giant_rp_e12 (same seed, scale, ppc,
# refresh@15, damping). ONLY change: precip_cells 1 -> 300.
# HYPOTHESIS (from the ladder closed 4.5e-6 -> rp 1e-5 -> hybrid 4.3e-4, x95):
# the wave-boosting lever is the boundary u_perp-removal GEOMETRY. If widening
# the precip layer makes WB climb toward hybrid / makes elements, the u_perp-
# removal WIDTH is confirmed as the mechanism (and precip's returning cold
# ghost is harmless). If WB stays ~1e-5, it's something specific to bnd_x=2.

[grid]
nx = 5000
ny = 1
Lx = 1300.0
Ly = 0.26

[time]
dt = 0.15
nsteps = 83334          # t_end = 2500/We0

[field]
model = yee
jfilter = 3
tile_sort = 25

[plasma]
qm = -1.0
cold_nc = 0.9822
rel = true
noisy = true
seed = 20260720          # SAME seed as giant_rp_e12 / giant_e12

[background]
wce = 0.2
profile = dipole
lre = 1330.504

[boundary]
x = damping
nd = 300
numax = 0.1

[antenna]
amp = 0.0

[species hot]
density = 0.0178
ppc = 110000
uth = 0.19783565 0.24390817 0.24390817
rep = fullf
dist = losscone
rho = 1.0
kappa = 0.3

[diagnostics]
# lat:     -25    -20    -15    -12.5  -10    -7.5   -5     -2.5  0
probes = -609.1 -480.4 -355.6 -294.6 -234.5 -175.1 -116.4 -58.1 0.0 58.1 116.4 175.1 234.5 294.6 355.6 480.4 609.1

[refresh]
enable = true
lambda_deg = 15.0        # original rp shell position (shown irrelevant)
shell = 15.0
precip = true
precip_cells = 300.0     # <-- ONLY CHANGE: 1 -> 300 (wide u_perp layer @ lat>22)

# Case II parameters at x20 dipole compression (lre halved vs the x10
# baseline chen2026_case2_giant.ini). Runner: ./chirp2d <this> <outdir> --fullf
#
# PURPOSE: test the element-repetition-period prediction T_rep ~ T_b/2
# proportional to lre. Baseline (x10, lre=1330.504) measured 850-900/We0
# early; x20 predicts ~430-470/We0. Same latitude range (lambda +-26.6 deg,
# wall mirror ratio 2.47), so the domain length halves: nx = 2500.
# ppc kept at 110000 (212M markers). Probes at lambda = 0, +-5, +-10,
# +-15 deg BOTH hemispheres (per-element north/south preference statistics).

[grid]
nx = 2500
ny = 1
Lx = 650.0
Ly = 0.26

[time]
dt = 0.15
nsteps = 200000          # t_end = 6000/We0 = 30000/wpe (>= 8-10 predicted periods)

[field]
model = yee
jfilter = 3
tile_sort = 25             # mandatory at this ppc (flat atomics collapse)

[plasma]
qm = -1.0
cold_nc = 0.9822         # ne0 - nh (total wpe^2 = 1)
rel = true
noisy = true
seed = 20260721

[background]
wce = 0.2
profile = dipole
lre = 665.252            # x20-compressed dipole: half the x10 baseline

[boundary]
x = hybrid
nd = 300                 # same 78 c/wpe absorber thickness; NOTE particle wall
numax = 0.1              # moves to lat ~20.3 deg here (24% of this short domain)

[antenna]
amp = 0.0                # self-seeding from shot noise

[species hot]
density = 0.0178
ppc = 110000             # 212M markers total
uth = 0.19783565 0.24390817 0.24390817
rep = fullf
dist = losscone
rho = 1.0
kappa = 0.3

[diagnostics]
probes = -177.8 -117.2 -58.2 0.0 58.2 117.2 177.8   # lat -15..+15 deg

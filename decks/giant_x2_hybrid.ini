# LRE-SCAN x2 HYBRID (2026-07-30): can hybrid excite whistler elements at a
# 5x-weaker dipole gradient? Exact x5 SPATIAL scaling of giant_e12 (x10):
# lre, Lx, nd, probe positions all x5 -> wall stays at lat +-26.3 deg, carve
# band (Umeda layer) stays at lat 23.6-26.3 deg -> mirror ratio 2.05-2.38 and
# equatorial loss cone (44.2 deg at carve inner edge) IDENTICAL to x10/x5 ->
# hot f0 (uth + losscone rho=1 kappa=0.3) unchanged BY CONSTRUCTION. Only the
# gradient (and box transit/bounce times, x5) changes: clean lre-only arm.
#
# Omura numbers at lre=6652.52 (a~=2.542e-6): B_th(0.25 Oe)=1.99e-6 <<
# noise floor -> threshold gate NON-OPERATIVE (deeper flood regime than x5);
# B_opt=1.05e-2 unchanged (lre-free).
#
# CAUSALITY WINDOW (the point of this run): earliest wall-reacher round trip
# ~5x the x10 640/We0 -> ~3200/We0; driver T_b ~12000/We0. Any coherent
# element born before t~3000/We0 CANNOT involve boundary-processed particles.
#   (1) elements by t<~3000 -> birth needs NO boundary u_perp carving
#       (equatorial anisotropy suffices; carving governs repetition/refill).
#   (2) structureless broadband flood, no discrete elements -> discreteness
#       needs the threshold gate (B_th ~ noise here -> none) -> boundary role
#       at x10/x5 secondary to threshold physics.
#   (3) nothing above noise -> falsifies equatorial-anisotropy driver.
# Bonus theory-matrix points at 3rd lre: sat vs B_opt (lre-free), sweep-rate
# vs amplitude (Eq. 88, lre-free).
#
# ppc 110000 -> 22000 (nx x5, marker total held at GPU-limit 550M; shot noise
# x2.2 vs e12 -- irrelevant here, threshold is 600x below x10's).
# Runner: ./chirp2d <this> <outdir> --ckpt=25000   (rotating 13GB ckpt only;
# NO --ckptseq/--fullf -- line diags at nx=25000 stay a few GB total)

[grid]
nx = 25000
ny = 1
Lx = 6500.0
Ly = 0.26

[time]
dt = 0.15
nsteps = 166667         # t_end = 5000/We0 = 25000/wpe (boundary-free epoch
                        # t<3200 + first wall-return epoch)

[field]
model = yee
jfilter = 3
tile_sort = 25

[plasma]
qm = -1.0
cold_nc = 0.9822
rel = true
noisy = true
seed = 20260720          # SAME seed family as giant runs

[background]
wce = 0.2
profile = dipole
lre = 6652.52            # x2 compressed = 5x the x10 baseline 1330.504

[boundary]
x = hybrid
nd = 1500                # x5 of e12's 300 -> layer inner edge s=3110 (lat
numax = 0.1              # 23.6 deg), SAME latitude band as x10 carve band

[antenna]
amp = 0.0

[species hot]
density = 0.0178
ppc = 22000              # 550M markers (GPU limit), = e12's total
uth = 0.19783565 0.24390817 0.24390817
rep = fullf
dist = losscone
rho = 1.0
kappa = 0.3

[diagnostics]
# lat:     -25     -20     -15     -12.5   -10     -7.5    -5     -2.5   0   (x5 of e12)
probes = -3045.5 -2402.0 -1778.0 -1473.0 -1172.5 -875.5 -582.0 -290.5 0.0 290.5 582.0 875.5 1172.5 1473.0 1778.0 2402.0 3045.5

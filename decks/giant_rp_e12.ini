# REFRESH+PRECIP dense-diagnostic run to t2500 — the DAMPING-base counterpart
# to giant_e12 (hybrid). Same seed/physics/scale; only [boundary]=damping (forced
# by the refresh code guard) + [refresh] enable/precip. Detector pack + 17 probes
# + dense ckpt (--ckpt=2500 --ckptseq). Compare front-to-front with giant_e12:
# does refill+precipitation change the first two elements vs plain hybrid?

[grid]
nx = 5000
ny = 1
Lx = 1300.0
Ly = 0.26

[time]
dt = 0.15
nsteps = 83334          # t_end = 2500/We0 (elements 1 & 2 window)

[field]
model = yee
jfilter = 3
tile_sort = 25

[plasma]
qm = -1.0
cold_nc = 0.9822
rel = true
noisy = true
seed = 20260720          # SAME seed as giant_e12

[background]
wce = 0.2
profile = dipole
lre = 1330.504

[boundary]
x = damping              # refresh REQUIRES damping (hybrid rejected by code guard)
nd = 300
numax = 0.1

[antenna]
amp = 0.0

[species hot]
density = 0.0178
ppc = 110000
uth = 0.19783565 0.24390817 0.24390817
rep = fullf
dist = losscone
rho = 1.0
kappa = 0.3

[diagnostics]
# lat:     -25    -20    -15    -12.5  -10    -7.5   -5     -2.5  0
probes = -609.1 -480.4 -355.6 -294.6 -234.5 -175.1 -116.4 -58.1 0.0 58.1 116.4 175.1 234.5 294.6 355.6 480.4 609.1

[refresh]
enable = true
lambda_deg = 15.0
shell = 15.0
precip = true

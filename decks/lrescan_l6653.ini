# LRE SCAN v2 arm x2 (2026-08-09): weakest-gradient extension of the
# conecut scan (base = giant_x4_atmo40 physics). lre=6652.52 -> B_th is
# 16x LOWER than the x4 arm's; 07-30 design predicted "deep flood" here --
# this arm tests that corridor edge from below.
# PPC EXCEPTION (the ONLY deviation from the frozen uniform-28000 rule):
# nx=38784 at ppc=28000 would be 1.09G markers ~60GB > 32GB GPU. This arm
# runs ppc=14000 (543M markers ~30GB = same cap as the x4 arm). Noise
# floor 1.4x higher (1/sqrt(ppc)) -> MORE ignition-prone: conservative
# for a flood test (a clean element train here would be extra-robust).
# If this arm's state ends up load-bearing, cross-check x4 at ppc=14000.
# All else zero-diff: conecut biMax uth=(0.19784,0.24391,0.24391)
# nh=0.0178, wall MLAT=40deg (Lx=2*g(40)*lre), x=atmo batm=cone_b=7.4057,
# nd=500, numax=0.1, dx=0.26, dt=0.15, dipole, seed 20260720, t10000.
# This arm: nx=38784, Lx=10083.84, 543M markers.
# Runner: ./chirp2d <this> <outdir> --ckpt=100000


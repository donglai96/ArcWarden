# REFRESH+PRECIP basic test arm — chen case2, damping walls, shell bath +
# real precipitation (docs/REFRESH_DESIGN.md precip section). The complete
# loss+refill loop: wall strips zero u_perp of true-cone arrivals (energy
# logged), mu=0 ghosts stream home and are recycled at the far shell.
# Judge: envelope vs B_th=1.24e-3, discrete elements, precip pulses.
# Pair with decks/chen2026_case2_refl.ini (the closed arm).
# Runner: ./chirp2d <this> <outdir> --fullf --ckpt=100000
# Expected if the refill hypothesis holds: the element train does NOT die
# and the ACF period stays stationary (no 894 -> ~1500 late stretch).

[grid]
nx = 5000
ny = 1
Lx = 1300.0
Ly = 0.26

[time]
dt = 0.15
nsteps = 333333          # t_end = 10000/We0 = 50000/wpe

[field]
model = yee
jfilter = 3
tile_sort = 25           # mandatory at giant ppc (flat-path atomics: 52x slower — learned twice, 07-26)

[plasma]
qm = -1.0
cold_nc = 0.9822
rel = true
noisy = true
seed = 20260720

[background]
wce = 0.2
profile = dipole
lre = 1330.504

[boundary]
x = damping
nd = 300
numax = 0.1

[antenna]
amp = 0.0

[species hot]
density = 0.0178
ppc = 800
uth = 0.19783565 0.24390817 0.24390817
rep = fullf
dist = losscone
rho = 1.0
kappa = 0.3

[diagnostics]
probes = -233.0 -116.4 0.0 116.4 233.0

[refresh]
enable = true
lambda_deg = 15.0
shell = 15.0
precip = true

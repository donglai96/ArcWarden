# UBSCAN arm 2/2 (2026-08-16): pancake FUEL ladder on the giant_x4_atmo40
# engine — user directive "reproduce upper band, scan the initial
# distribution, previous pancake one as reference". Reference = expG2_ctrl
# (n2=0.0035, A2=5, u2=0.06): UB channel ALIVE (Step-2 mining: b2=0.19
# locked, UB -> 3e-3 B0) but EPISODIC (Step-3: 2nd LB burst P_LB x13, UB
# did NOT respond -> pancake free energy finite, QL self-flattening).
# ONE delta vs reference: n2 0.0035 -> 0.0140 (4x fuel; A2=5, u2=0.06,
# engine, seed, box all held). ppc2 scaled 8000->16000 = marker weight
# parity with reference.
# Pre-registered (ub_net_threshold solver, engine bare-A 0.52):
#   arm    n2      gamma_UB(max)  band(+)      LB gamma   t_ign(x2.3conv)
#   ref    0.0035  +6.6e-4 @0.52  [0.45,0.66]  1.7e-3     ~11900/We
#   n70    0.0070  +2.5e-3 @0.52  [0.45,0.75]  1.8e-3     ~3100/We
#   n140   0.0140  +6.1e-3 @0.52  [0.45,0.79]  4.4e-3     ~1300/We (flood risk)
# HEADLINE question (U2, frozen gate scripts/ubscan_gate.py): does 2x fuel
# turn the episodic UB into a SUSTAINED band (R_late >= 0.5 vs ref 0.326)?
# Also U3 band-top extension 0.66->0.75 and U4 0.5-valley persistence.
# Pre-registered failure reading: n70+n140 both EPISODIC despite 3.8x/9.3x
# gamma -> exhaustion is amplitude-side (QL flattening at fixed resonant
# shell), fuel axis closed -> next axis = u_par2/A2 (USER decision).

# SMOKE TEST — refresh + REAL PRECIPITATION (loss+refill loop, fixed N):
# Chen case-2 geometry at throwaway resolution (ppc = 50, t = 1500/wpe =
# 300/We0, seconds of GPU). Checks: precip counter fires (loss-cone markers
# reach the walls within ~half a bounce), dE_precip > 0 accumulates, the
# bath recycles the mu = 0 ghosts (redraws present), energies stay finite.
# NOT physics — the noise floor at ppc 50 is enormous. See refresh.hpp.
# Runner: ./chirp2d <this> <outdir> --fullf

[grid]
nx = 5000
ny = 1
Lx = 1300.0
Ly = 0.26

[time]
dt = 0.15
nsteps = 10000

[field]
model = yee
jfilter = 3

[plasma]
qm = -1.0
cold_nc = 0.9822
rel = true
noisy = true
seed = 20260720

[background]
wce = 0.2
profile = dipole
lre = 1330.504

[boundary]
x = damping
nd = 300
numax = 0.1

[antenna]
amp = 0.0

[refresh]
enable = true
lambda_deg = 15.0
shell = 15.0
precip = true

[species hot]
density = 0.0178
ppc = 50
uth = 0.19783565 0.24390817 0.24390817
rep = fullf
dist = losscone
rho = 1.0
kappa = 0.3

[diagnostics]
probes = -233.0 -116.4 0.0 116.4 233.0

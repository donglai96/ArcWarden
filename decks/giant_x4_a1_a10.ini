# A1 PILOT (2026-08-06, PLAN_TWO_TRACK v2.1 execution step 5): D120 +
# calibrated weak trigger, 1.0e-4 arm — PRE-COMMITTED pair, both amplitudes
# run regardless of first result (anti-optional-stopping).
# = giant_x4_acal_a10.ini with nsteps extended to t4000/Oe. A-cal
# 2026-08-06 (scripts/acal_verdict.py on build/acal_{a05,a10}):
#   amp 5e-5 -> dB_trig/B0 = 7.4e-4, amp 1e-4 -> 1.46e-3 at the +-145.2
#   probes (probe-mean), linearity dev 0.8% PASS, in-band noise ~4e-5;
#   packet convectively amplified 2e-4 -> 6.8e-4 by t2100/wpe = the D120
#   medium has gain at 0.25 We0.
# toff = 1000/wpe = 200/Oe: antenna silent long before any ridge activity
# (self element from ~500/Oe) -> the "off before ridge hits 0.4" gate is
# satisfied by construction; the pilot question is whether the trigger
# advances/organizes the element vs the untriggered d120_ctrl baseline.

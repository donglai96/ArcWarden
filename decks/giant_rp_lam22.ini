# SINGLE-VARIABLE TEST vs giant_rp_e12: refresh redraw shell moved OFF the wave
# peak. In giant_rp_e12 the shell sits at lat 15.0-15.6 deg (s_r=lre*s(15deg)=
# 355.6 c/wpe) = EXACTLY the measured |Bw| peak (14-16 deg) -> refresh resets
# every outward-crossing particle to fresh f0 right where the wave amplifies.
# Here lambda_deg=22 puts the shell at lat ~22-22.6 deg (loss/boundary region,
# where outgoing waves are already absorbed) -> off the amplification zone.
# EVERYTHING ELSE IDENTICAL (same seed 20260720, scale, ppc, precip, damping).
# HYPOTHESIS: if WB now climbs toward hybrid (4.2e-4) / makes elements, the
# refresh-on-the-peak was the suppressor; if WB stays ~1e-5, it's the u_perp
# removal geometry, not refresh. Fresh run from t0 (not a resume).

[grid]
nx = 5000
ny = 1
Lx = 1300.0
Ly = 0.26

[time]
dt = 0.15
nsteps = 83334          # t_end = 2500/We0 (hybrid made elements 1&2 here)

[field]
model = yee
jfilter = 3
tile_sort = 25

[plasma]
qm = -1.0
cold_nc = 0.9822
rel = true
noisy = true
seed = 20260720          # SAME seed as giant_rp_e12 / giant_e12

[background]
wce = 0.2
profile = dipole
lre = 1330.504

[boundary]
x = damping              # refresh REQUIRES damping (hybrid rejected by code guard)
nd = 300
numax = 0.1

[antenna]
amp = 0.0

[species hot]
density = 0.0178
ppc = 110000
uth = 0.19783565 0.24390817 0.24390817
rep = fullf
dist = losscone
rho = 1.0
kappa = 0.3

[diagnostics]
# lat:     -25    -20    -15    -12.5  -10    -7.5   -5     -2.5  0
probes = -609.1 -480.4 -355.6 -294.6 -234.5 -175.1 -116.4 -58.1 0.0 58.1 116.4 175.1 234.5 294.6 355.6 480.4 609.1

[refresh]
enable = true
lambda_deg = 22.0        # <-- ONLY CHANGE: 15.0 -> 22.0 (shell off the wave peak)
shell = 15.0
precip = true

# PLAN_2D v2 FLAGSHIP (P0-4, 2026-08-09): max full-2D slab mirror, kinetic
# resonant electrons from t=0, NO preset plateau. Physics spine: N_g(w) =
# int gamma/vg ds runway (Lx = 1331 = 0.6 RE at the x10 mapping) flips
# N_g,UB over threshold; causality target E_par -> df(0.08-0.10c) ->
# plateau -> 0.5 power drop (PLAN_2D.md section 1.3, 7 frozen criteria).
#
# Electron model (three populations):
#   cold fluid  cold_nc = 0.9810  (bulk + the resonant pool's chi_r
#               complement 0.012*(1-f_shell); ADJUST after the stage-1
#               smoke prints the measured f_shell — v0 assumes ~0.75)
#   chorus      bimax nh = 0.010, upar 0.13, T_perp/T_par = 4.5 (= ke17
#               anchor; PLAN_2D "A=4.0-4.5 NOT 6, 2D threshold lower")
#   resonant    prodkappa n_r = 0.012, kappa_par 4, theta_par 0.12,
#   pool        u_perp_th 0.15 (mild, energy-decreasing anisotropy),
#               cone_b = b_wall = 2.125, chi_r shell |v_par,eq| in
#               [0.04, 0.30]c (dv 0.02) covering UB-cyclotron (0.05-0.07),
#               0.5-Landau (0.087-0.10), LB-cyclotron (0.15-0.26) shells;
#               full charge/current feedback, real bounce, never refreshed.
# Grid: 4096x512, dx 0.325, dy 0.699 (rho_perp/dy ~ 2 at A=4.5 = G1.2 rule
# floor, recorded); slab mirror a = 2.54e-6 = 4.5/lre^2, lre = 1330.5 (x10),
# wall mirror ratio 2.125. dt 0.15 (CFL limit 0.230 in wpe units: dx/(c*sqrt2)).
# Boundary: x = hybrid (Lu absorb+reflect + u_perp layer; P0-3 audit: shared
# pusher path, wall |B| 4.8x below damping-only in smoke), nd = 240 cells =
# 78 c/wpe physical (matches Lu nd=300 x dx=0.26); y periodic (y-wrap slab
# jump here ~1.2 B0 < ke17's proven 2.4 B0).
# Markers: (200+110) ppc EQUATOR x (E,mu) taper -> ~420M measured ~24GB incl
# tile-sort double buffer (smoke v0: (130+70) ppc -> 250.5M = 14.3GB, 57B/marker). Probes = x10 MLAT arc set.
# Stages (PLAN_2D section 4): 1 smoke (hundreds) -> 2 linear t~400 -> 3 first
# element t1000-1500 -> 4 t3000 -> 5 t6000-12000 (shell transit ~5300/We).
# Runner: ./mirror2d <this> <outdir> --ckpt=50000 [--resume]

[grid]
nx = 4096
ny = 512
Lx = 1331.20
Ly = 357.89

[time]
dt = 0.15
nsteps = 200000          # t_end = 6000/We0 (stage 5a; extend by resume)

[field]
model = yee
cold_model = full
jfilter = 3
tile_sort = 25

[plasma]
qm = -1.0
cold_nc = 0.9810
rel = true
noisy = true
seed = 20260720

[background]
wce = 0.2
profile = mirror2d
a = 2.54e-6              # = 4.5/lre^2, lre = 1330.5 (x10 parabolic map)

[boundary]
x = hybrid
nd = 240                 # 78 c/wpe physical absorber (Lu-equivalent)
numax = 0.1

[antenna]
amp = 0.0

[species chorus]
density = 0.010
ppc = 200
uth = 0.13 0.27577 0.27577    # T_perp/T_par = 4.5
rep = fullf
dist = bimax

[species pool]
density = 0.012
ppc = 110
uth = 0.12 0.15 0.15
rep = fullf
dist = prodkappa
kappa_par = 4.0
cone_b = 2.125           # = wall mirror ratio 1 + a*(Lx/2)^2
shell = 0.04 0.30 0.02   # chi_r window on equatorial |v_par| (c units)

[diagnostics]
# x10 MLAT arcs (lre=1330.5): eq, +-{2.5,5,7.5,10,12.5,15,20,25} deg
probes = -609.1 -480.4 -355.6 -294.6 -234.5 -175.1 -116.4 -58.1 0.0 58.1 116.4 175.1 234.5 294.6 355.6 480.4 609.1

# RSM V5 — THE HYPOTHESIS DECK: Chen 2026 Case-II mirror chirp + the m = +-1
# oblique harmonic in ONE full-f box (docs/RSM_MODEL_DEFINITION.md ladder V5).
# Base = decks/chen2026_case2.ini (our chirp anchor, single rising tone
# 0.25 -> 0.60 We0 at t ~ 7000-8000/We0) with the RSM channel added:
#   k1 = 0.16 = 15 deg WNA at the chirp-onset k_par ~ 0.58 (omega = 0.25 We0)
#   Ly = 2*pi/k1 (the phase contract; Ly was inert at ny = 1)
#   m = 0: the chirping parallel chorus engine (unchanged physics)
#   m = 1: the oblique Landau processing channel (E1x = E_par)
# Level-2/3 question: does the m1 channel carve a 0.5 fce feature into the
# m0 chirp spectrum? Judge ONLY from separate P0 / P1 modal spectra (V6).
# Runner: ./chirp2d <this> <outdir> --fullf   (flat path: RSM constraint)

[grid]
nx = 5000
ny = 1
Lx = 1300.0
Ly = 39.269908169872     # = 2*pi/k1 (RSM phase contract)

[time]
dt = 0.15
nsteps = 333333          # t_end = 10000/We0 = 50000/wpe

[field]
model = yee
jfilter = 3

[plasma]
qm = -1.0
cold_nc = 0.9822
rel = true
noisy = true
seed = 20260720

[background]
wce = 0.2
profile = dipole
lre = 1330.504

[boundary]
x = hybrid
nd = 300
numax = 0.1

[antenna]
amp = 0.0

[rsm]
enable = true
k1 = 0.16

[species hot]
density = 0.0178
ppc = 800
uth = 0.19783565 0.24390817 0.24390817
rep = fullf
dist = losscone
rho = 1.0
kappa = 0.3

[diagnostics]
probes = -233.0 -116.4 0.0 116.4 233.0

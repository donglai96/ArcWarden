# V4R7-DF-A2 — first delta-f production shakedown (user 2026-08-19:
# "先用 delta f, 主要目的是产生干净的 chirping element").
# A=2 (uthperp 0.244): saturation B_w/B0 ~ 6e-3 -> sweep rate ~5e-4
# Wce^2 -> elements Wce*tau ~ 390 (~13k steps each) — the clean-element
# sweet spot reachable in one afternoon run. Theory gamma_max = 4.53e-3
# Wce at w_r = 0.309 (solver, this deck's exact params); with the ~45%
# global-mode reduction measured at A=3, seed-to-saturation ~ 145k
# steps; nsteps 200000 holds saturation + 3-4 elements.
# DOUBLES AS G4: wd_rms through saturation is the remaining delta-f
# gate — watch the wd column (expect growth to O(0.1-0.3) at the
# resonant plateau; runaway to O(1) = validity boundary, abort+report).
# taud = 0 ALWAYS (H1/H2 discriminator ruling).

[domain]
lam_w_deg = 50
x_min     = 2500
active_Lmin = 3300
active_Lmax = 4700
margin    = 60
dx = 0.25
dz = 0.25

[background]
profile = dipole2d
B0eq    = 0.2
L0      = 4000

[time]
dt     = 0.15
nsteps = 200000

[cold]
nc = 0.99
c  = 1.0
nonlinear = 0

[boundary]
absorber_cells = 240
runway_lam_deg = 25

[diag]
target_band_max = 0.75
target_wna_deg  = 45
target_lam_deg  = 20
snap_every      = 10000
energy_every    = 100
probe_every     = 4
fv_every        = 20000
dens_init       = 0

[species engine]
deltaf   = 1
rel      = 1
dist     = 0
n0       = 0.010
uthpar   = 0.141
uthperp  = 0.244
shell_L0 = 4000
shell_dL = 60
ppc      = 100

# G2.2 — 2D slab mirror physics shakeout: whistler-unstable warm minority
# in the mirror2d geometry, both species rho/dy >= 2 (test_mirror2d rule 1),
# warm beta_perp = 2*0.06*0.0064/0.0625 = 0.012 (rule 2 OK).
# Gates (pre-registered, GAP_PLAN G2.2 PREP): linear-stage WNA map matches
# ray_mirror2d.py (near-parallel); E_par thermal-level; theta-spectrum from
# the instability at saturation. Runner: ./mirror2d <this> <outdir>
# omega_b(warm) = sqrt(a)*0.08 = 7.8e-4 -> T_b = 8055/wpe = 403k steps;
# whistler saturation expected ~8000/wpe = 160k steps.

[grid]
nx = 2560
ny = 80
Lx = 204.8
Ly = 6.4

[time]
dt = 0.05
nsteps = 320000

[field]
model = yee
jfilter = 3
tile_sort = 25

[plasma]
qm = -1.0
rel = false
noisy = true
seed = 20260723

[background]
wce = 0.25
profile = mirror2d
a = 9.5367431640625e-05      # R_wall = 2

[boundary]
x = damping

[species cold]
density = 0.94
ppc = 200
uth = 0.04 0.04 0.04

[species warm]

# EXPERIMENT F (2026-08-01): the B<->C balance via a REALISTIC single f0.
# Ladder recap: A/B = bi-Max A=0.52 (+/- rsm): discrete elements, upper band
# forbidden. C/D = bi-Max A=1.5 (+/- rsm): two-band capable but ONE violent
# burst (gamma 8x the element engine); C gap attribution closed vs D.
# E (n_h dose) showed 5.4x still elements-regime but NO gap claim (user).
#
# F = C's deck with the HOT DISTRIBUTION SHAPE as the only physics change
# (n_h = 0.0178 identical to B/C — strict comparability):
#   dist = prodkappa: f = [1+u_par^2/(2 k th_par^2)]^-k * Max_perp * conecut
#   theta_par = 0.10 (cold core), kappa_par = 2.5 (suprathermal tail),
#   uth_perp = 0.162.
# KP anisotropy A(v) DECREASES with energy (the kappa property C lacks):
#   A(0.065c) = 1.42 ~ C     -> upper-band resonant electrons: C-like drive
#   A(0.094c) = 1.23         -> Landau window
#   A(0.20c)  = 0.46 ~ B     -> lower-band resonant electrons: B-like drive
# Global moments T_perp/T_par = 1.05 (softer than B's 1.52!). gamma_max(KP)
# = 7.4e-3 = 2.5x element engine (safe: E proved 5.4x still elements).
# omega_m ~ 0.58 -> linear spectrum covers both bands.
#   PREDICT: element-regime emission whose spectrum spans 0.2-0.6; judged
#   ONLY by quantitative valley metric + omega_stop statistics vs the
#   rsm-off partner (NO visual gap claims — 08-01 lesson).

# LRE-SCAN x4 ARM 1 (2026-07-30): realistic wall + self-consistent cone.
# lre = 13305.04/4 = 3326.26 (x4 COMPRESSION naming: between x5=2661 and
# x2=6652.5; B_th(0.25 Oe)=3.2e-5 ~ noise floor -> x5-like structured regime
# expected, vs x2's deep flood). Design per user analysis (07-30):
#   WALL 40 deg = Boris comfort limit (b_wall=7.4057, Oce*dt=0.222): the wall
#     determines the equatorial loss cone, alpha_LC = asin(1/sqrt(b_wall)) =
#     21.6 deg (down from x10-hybrid's artificial 44 deg; real L=5 is 3.8,
#     unreachable: cost ~ 1/alpha^2, 63 deg needs dt/23).
#   f0 = CONE-CUT bi-Max (NEW dist=conecut): trapped population only,
#     f = biMax(uth) * Theta(sin2(a_eq) - 1/b_wall) -- replaces the rho/kappa
#     subtracted-Max approximation per user directive. Load criterion
#     sin2(a_local) >= b_local/cone_b == the atmo boundary criterion with
#     batm = b_wall: load and boundary are the SAME operator (zero transient).
#   BOUNDARY x=atmo batm=b_wall: every wall-toucher has its mirror point
#     beyond the wall (loader guarantees none start that way) -> precipitate
#     (u_perp=0 return). nd=500 (130 c/wpe = 4 whistler wavelengths at the
#     wall's b~7 region; layer sits in fce>fpe plasma beyond lam 35.8 --
#     absorber checked in-run via x-t returning-striation test).
# Causality window: fastest wall-loaded one-way ~1240/We0. Driver T_b ~6250.
# Expected complex period (x5 ACF x lre ratio) ~3500/We0 -> t10000 = 2-3
# periods. Arm 2 (45 deg wall, dt=0.075 convergence) deferred.
# Runner: ./chirp2d <this> <outdir> --ckpt=25000 --noeline

[grid]
nx = 19392
ny = 1
Lx = 5041.92
Ly = 0.26

[time]
dt = 0.15
nsteps = 333333          # t_end = 10000/We0 = 50000/wpe

[field]
model = yee
jfilter = 3
tile_sort = 25

[plasma]
qm = -1.0
cold_nc = 0.9822
rel = true
noisy = true
seed = 20260720

[background]
wce = 0.2
profile = dipole
lre = 3326.26            # x4 compressed = 2.5x the x10 baseline 1330.504

[boundary]
x = atmo
nd = 500
numax = 0.1
batm = 7.4057            # = b_wall: wall IS the loss cone (all touchers
                         # precipitate; consistent with the conecut load)

[antenna]
amp = 0.0

[species hot]
density = 0.0178
ppc = 28000              # 543M markers (550M GPU budget) at nx=19392
uth = 0.19783565 0.24390817 0.24390817
rep = fullf
dist = conecut
cone_b = 7.4057          # alpha_LC,eq = 21.6 deg

[diagnostics]
# lat:     -35     -30     -25     -20     -15    -12.5  -10    -7.5   -5     -2.5  0    (x4 arcs)
probes = -2186.5 -1852.3 -1522.7 -1201.1 -888.9 -736.5 -586.2 -437.8 -291.0 -145.2 0.0 145.2 291.0 437.8 586.2 736.5 888.9 1201.1 1522.7 1852.3 2186.5

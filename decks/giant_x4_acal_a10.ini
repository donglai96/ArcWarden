# A-cal (2026-08-06, PLAN_TWO_TRACK v2.1 execution step 4): D120 antenna
# amplitude calibration, 1.0e-4 arm. = giant_x4_d120_ctrl.ini with the
# [antenna] block filled (amp is a CURRENT amplitude, NOT dB/B0 — the
# tao17 lesson) and nsteps cut to 16000 (t=2400/wpe = 480/Oe): the D120
# source SELF-generates its element from ~500/Oe, so the calibration
# window must close before that. trmp=250, toff=1000 -> measure the
# POST-OFF packet (no near-field, antenna already silent) at the +-145.2
# near-source probes in t in [toff, 2400]; vg(0.25 We0) ~ 0.13c covers
# the 145 c/wpe in ~1100/wpe. Verdict: scripts/acal_verdict.py — quote
# dB_trig/B0 per arm + linearity dB ~ amp across the {5e-5, 1e-4} pair.
# Runner: ./chirp2d <this> <outdir> --noeline

[grid]
nx = 19392
ny = 1
Lx = 5041.92
Ly = 39.269908169872     # = 2*pi/k1 (RSM phase contract)

[time]
dt = 0.15
nsteps = 16000           # t=2400/wpe: close before the self-generated element (~2500/wpe)

[field]
model = yee
jfilter = 3
tile_sort = 25           # RSM tiled deposit path (2026-07-31): shared m0
                         # tiles + 1-D complex m1 tiles; was the 8x slowdown

[plasma]
qm = -1.0
cold_nc = 0.9880
rel = true
noisy = true
seed = 20260720

[background]
wce = 0.2
profile = dipole
lre = 3326.26            # x4 compressed = 2.5x the x10 baseline 1330.504

[boundary]
x = atmo
nd = 500
numax = 0.1
batm = 7.4057            # = b_wall: wall IS the loss cone (all touchers
                         # precipitate; consistent with the conecut load)

[antenna]
amp = 1.0e-4          # CURRENT amplitude (calibration arm a10)
x0 = 9696              # cells: equator (nx/2)
sigma = 4
w0 = 0.05              # 0.25 wce
trmp = 250
toff = 1000

[species hot]
density = 0.0120
ppc = 36000            # 698M markers (~23 GB) at nx=19392
uth = 0.19783565 0.31283 0.31283
rep = fullf
dist = conecut
cone_b = 7.4057          # alpha_LC,eq = 21.6 deg

[diagnostics]
# lat:     -35     -30     -25     -20     -15    -12.5  -10    -7.5   -5     -2.5  0    (x4 arcs)
probes = -2186.5 -1852.3 -1522.7 -1201.1 -888.9 -736.5 -586.2 -437.8 -291.0 -145.2 0.0 145.2 291.0 437.8 586.2 736.5 888.9 1201.1 1522.7 1852.3 2186.5

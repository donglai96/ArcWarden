# PHASE Q quiet control (2026-08-09, PLAN_2D v3 user review): numerical
# closure BEFORE any physics. Isotropic everything = zero instability free
# energy; any growing wave power or T drift is NUMERICS.
# Deltas vs the (failed) flagship v0, per the seven-flaw review:
#   ny 512 -> 1024 (dy 0.3495): chorus rho/dy 3.95, pool 2.15 -- all >= 2;
#   ppc halved (100 / 40+15): per-column statistics unchanged;
#   x = damping (hybrid distorts pitch angles -> control/comparison only);
#   chi_r COMPLETE split: shell AND complement both KINETIC (importance
#     ppc 40 vs 15), cold_nc = 1 - 0.010 - 0.012 = 0.978 exactly;
#   NO tile_sort: flat path keeps species blocks contiguous -> per-species
#     fv/wl (fv_s*, wl_s*, fvyi_s* = y-interior twin for wrap-layer split).
# GATES: T_par/T_perp drift < 2-5% per species; no growing finite-ky
# whistler power; y-wrap layer vs interior separated; measure flat-path
# p-steps/s (Phase S budget input).
# Runner: ./mirror2d <this> <outdir> --ckpt=20000

[grid]
nx = 4096
ny = 1024
Lx = 1331.20
Ly = 357.89

[time]
dt = 0.15
nsteps = 33333           # t_end = 1000/We0 first pass

[field]
model = yee
cold_model = full
jfilter = 3

[plasma]
qm = -1.0
cold_nc = 0.978
rel = true
noisy = true
seed = 20260720

[background]
wce = 0.2
profile = mirror2d
a = 2.54e-6

[boundary]
x = damping
nd = 240
numax = 0.1

[antenna]
amp = 0.0

[species chorus_iso]
density = 0.010
ppc = 100
uth = 0.27577 0.27577 0.27577    # ISOTROPIC (quiet): rho/dy = 3.95
rep = fullf
dist = bimax

[species pool_shell]
density = 0.012
ppc = 40
uth = 0.15 0.15 0.15             # ISOTROPIC (quiet): rho/dy = 2.15
rep = fullf
dist = bimax
shell = 0.04 0.30 0.02

[species pool_comp]
density = 0.012
ppc = 15
uth = 0.15 0.15 0.15
rep = fullf
dist = bimax
shell = 0.04 0.30 0.02
shell_invert = 1

[diagnostics]
probes = -560.0 -480.4 -355.6 -294.6 -234.5 -175.1 -116.4 -58.1 0.0 58.1 116.4 175.1 234.5 294.6 355.6 480.4 560.0

# LRE SCAN v3 arm x10 (2026-08-09): FUEL-OPEN ladder — proof design for
# "real-lre gap": does weak gradient stall elements at 0.5 even when linear
# fuel extends ABOVE 0.5?  Two decoupled dials vs v2:
#   uth_perp 0.24391 -> 0.31306: bare A = 1.5 -> Kennel-Petschek marginal
#     w_m = 0.60 (conecut lift -> effective ~0.65). Fuel above 0.5 GUARANTEED
#     -> a 0.5 stall can no longer be blamed on the v2 fuel ceiling (0.44-0.47).
#   nh 0.0178 -> 0.006 (cold_nc 0.994): gamma_max ~2.7e-3 bare (vs v1 A=5
#     1.3e-2 which flooded weak arms) = flood dial, does not move w_m.
# PILOT PAIR gates (this arm + its partner):
#   x10: does the strong-gradient end IGNITE (v2's x10 at similar gamma was
#     dead)? dead -> raise nh one notch for the small-lre end / split ladder.
#   x2:  does the weak-gradient end stay UN-flooded (W10<0.20) and stall?
# Pre-registered per-arm chain: w_birth down with lre; R_opt=Bw(0.5)/B_opt(0.5)
# up through ~1 at the cross->stall boundary; endpoint cross (small lre) vs
# 0.5-stall (large lre) within ONE f0.
# All else = v2 conecut base: uth_par 0.19784, wall MLAT=40deg, x=atmo
# batm=cone_b=7.4057, nd=500, dx=0.26, dt=0.15, dipole, seed 20260720, t10000.
# This arm: lre=1330.504 (x10), nx=7757, Lx=2016.82, ppc=28000, 217M markers.
# Runner: ./chirp2d <this> <outdir> --ckpt=100000


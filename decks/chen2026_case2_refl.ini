# REFRESH Gate 3, CLOSED ARM — Chen 2026 Case II with the x = damping
# boundary (fields damped in the Umeda layers, particles reflect specularly
# = closed, energy-conserving particle system; this is CLOSER to the paper's
# "bare reflection" than our usual hybrid deviation, which refresh rejects —
# see include/pic/refresh.hpp header for the four measured failure modes).
# Pair with decks/chen2026_case2_refresh.ini (identical + [refresh]).
# Runner: ./chirp2d <this> <outdir> --fullf --ckpt=100000
# Expected (from the closed hybrid x10 runs): repetitive rising-tone
# elements, ACF period ~894/We0, period stretching late as fuel drains.

[grid]
nx = 5000
ny = 1
Lx = 1300.0
Ly = 0.26

[time]
dt = 0.15
nsteps = 333333          # t_end = 10000/We0 = 50000/wpe

[field]
model = yee
jfilter = 3
tile_sort = 25           # mandatory at giant ppc (flat-path atomics: 52x slower — learned twice, 07-26)

[plasma]
qm = -1.0
cold_nc = 0.9822
rel = true
noisy = true
seed = 20260720

[background]
wce = 0.2
profile = dipole
lre = 1330.504

[boundary]
x = damping
nd = 300
numax = 0.1

[antenna]
amp = 0.0

[species hot]
density = 0.0178
ppc = 800
uth = 0.19783565 0.24390817 0.24390817
rep = fullf
dist = losscone
rho = 1.0
kappa = 0.3

[diagnostics]
probes = -233.0 -116.4 0.0 116.4 233.0

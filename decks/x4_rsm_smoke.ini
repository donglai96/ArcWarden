# GATE DECK (2026-07-31): rsm x atmo x conecut together, shrunk x4 —
# exercises the NEW atmo branch in the RSM pusher (rsm_oblique.hpp) before
# the 543M-marker burn. Geometry: same lre/wce, wall pulled in to s = 1300
# (lat 21.55 deg, b_wall = 1.8311 exact via dipole_b_of_s) -> cone 47.6 deg,
# conecut density factor K = 0.75. Plumbing gate only: judged as "runs /
# precipitation branch consistent / m1 grows with whistler dispersion /
# no NaN / ckpt resume".
# Gates (docs/X4_RSM_EPAR_PLAN.md §4): G-R1 smoke, G-R2 atmo parity
# (rerun with enable=false, compare precipitation + m0 envelope), G-R4 m1
# hygiene (P1 spectrum, divB1).
# Runner: ./chirp2d <this> <outdir> --ckpt=10000 --noeline

[grid]
nx = 10000
ny = 1
Lx = 2600.0
Ly = 39.269908169872     # = 2*pi/k1

[time]
dt = 0.15
nsteps = 20000           # t_end = 600/We0

[field]
model = yee
jfilter = 3

[plasma]
qm = -1.0
cold_nc = 0.9822
rel = true
noisy = true
seed = 20260720

[background]
wce = 0.2
profile = dipole
lre = 3326.26

[boundary]
x = atmo
nd = 300
numax = 0.1
batm = 1.8311            # = b_wall at s = 1300 c/wpe, lre 3326.26

[antenna]
amp = 0.0

[rsm]
enable = true
k1 = 0.16

[species hot]
density = 0.0178
ppc = 4000
uth = 0.19783565 0.24390817 0.24390817
rep = fullf
dist = conecut
cone_b = 1.8311          # = batm (load == boundary operator)

[diagnostics]
probes = -260.0 0.0 260.0

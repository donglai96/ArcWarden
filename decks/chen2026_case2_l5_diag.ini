# x5 HYBRID GENERATION-MECHANISM run (2026-07-27): rerun of chen2026_case2_l5
# (identical physics/seed/scale) with the full detector pack to answer WHERE
# and HOW the whistlers are generated in the x5 refill-gated complex regime —
# equatorial anisotropy instability vs mid-latitude carved-beam source (the
# burst_study mechanism hybrid walls can fake).
#
# Detector pack (needs the 07-27 chirp2d eline/jline/probe_e build):
#   eline+bline  -> Poynting S_x(x,t) = EyBz-EzBy: sources = divergence points
#   jline (HOT J only) x eline -> J.E ledger: Jy Ey+Jz Ez = cyclotron channel,
#                Jx Ex = Landau; J.E<0 in a region = generation (particles->wave)
#   probes: 17 stations, lat 0,+-2.5,...,+-15,+-20,+-25 deg both hemispheres
#           (s(lambda) arc length at lre=2661.008; +-25 deg = 1218.2 sits just
#           equatorward of the Umeda layer edge 1222 — monitors absorber input)
#   probe_e -> per-station S_x at 1/wpe cadence (element-resolved direction)
#   --ckpt=25000 (750/We0) + watcher -> f(v|region) fuel gauge + carving map
# Runner: ./chirp2d <this> <outdir> --fullf --ckpt=25000
# Judges: (1) sign/latitude map of J.E at complex ignition vs during flood;
# (2) S_x divergence latitude per element; (3) carving fraction at the layer
# vs time correlated with (1); (4) sub-riser vs complex: same or different
# source latitude. Archived twin without detectors: build/chen2026_case2_l5.

[grid]
nx = 10000
ny = 1
Lx = 2600.0
Ly = 0.26

[time]
dt = 0.15
nsteps = 500000          # t_end = 15000/We0 = 75000/wpe

[field]
model = yee
jfilter = 3
tile_sort = 25             # mandatory at this ppc (flat atomics collapse)

[plasma]
qm = -1.0
cold_nc = 0.9822         # ne0 - nh (total wpe^2 = 1)
rel = true
noisy = true
seed = 20260721          # same seed as the archived l5 run (statistical twin)

[background]
wce = 0.2
profile = dipole
lre = 2661.008           # x5-compressed dipole

[boundary]
x = hybrid
nd = 300                 # same 78 c/wpe absorber as all giant runs
numax = 0.1

[antenna]
amp = 0.0                # self-seeding from shot noise

[species hot]
density = 0.0178
ppc = 55000              # 425M markers (GPU limit at nx=10000)
uth = 0.19783565 0.24390817 0.24390817
rep = fullf
dist = losscone
rho = 1.0
kappa = 0.3

[diagnostics]
# lat:      -25     -20     -15     -12.5   -10     -7.5    -5      -2.5   0
probes = -1218.2 -960.8 -711.1 -589.2 -469.0 -350.3 -232.8 -116.2 0.0 116.2 232.8 350.3 469.0 589.2 711.1 960.8 1218.2

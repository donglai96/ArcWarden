# V4R9-DF-A3 — delta-f clean-element run, third attempt (the ladder
# taught us the finite-source reduction is STEEP: gamma_global/gamma_hom
# measured A=3 ~45%, A=2.5 ~11% (outer-column selection, L~4020-4050),
# A=2 ~2% (threshold-marginal). A=3 is the lowest rung whose growth is
# PROVEN on the probe line (XVAL delta-f arm: gamma_env 1.73e-3/wpe,
# mode 0.31-0.36 wce). Saturation Bw/B0 ~ 1e-2, elements Wce*tau ~ 240
# (3x A=5); delta-f seed 1e3 below full-f floor -> saturation ~ t 20000
# (~135k steps); 200k holds saturation + 4-5 elements. G4 (wd through
# saturation) decides delta-f's saturation-stage validity here.
# DOUBLES AS G4: wd_rms through saturation is the remaining delta-f
# gate — watch the wd column (expect growth to O(0.1-0.3) at the
# resonant plateau; runaway to O(1) = validity boundary, abort+report).
# taud = 0 ALWAYS (H1/H2 discriminator ruling).


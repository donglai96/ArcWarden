# CONTROL for decks/rsm_band_li_big.ini: identical box/plasma/seed, NO m=1
# channel (strictly parallel physics, E_par = 0 everywhere by geometry).
# Runner: ./liband_yee <this> <outdir>   (theta_deg = 0 is allowed there).
# Any f(vpar) resonance-region difference RSM-minus-control is the m1
# Landau channel net effect — the causality cut the tilted box cannot do.
# (docs/RSM_MODEL_DEFINITION.md ladder V4). Same plasma as li2019_band.ini
# (our G2.1 two-band repro), geometry inverted: B0 strictly along x
# (theta_deg = 0), obliquity carried by the SPECTRAL m = +-1 harmonic at
# k_perp = k1 = 2*pi/Ly = 0.16 wpe/c — the 15-deg WNA of the tilted-box run
# evaluated at the lower-band k_par ~ 0.6 (fixed k_perp != fixed WNA: theta
# varies along the band; the semantic difference is the point of the model).
#   m = 0: strictly parallel whistlers (cyclotron channel only, E_par = 0)
#   m = 1: oblique response (the Landau channel; E1x = E_par)
# All-PIC (cold kinetic to Landau-resonate, as in Li), flat deposit path
# (RSM constraint: tile_sort = 0), no m1 seed (shot noise via J1 deposit).
# Runner: ./rsm_band <this> <outdir>
# Expected: parallel band grows as in G2.1; m1 grows to a weaker oblique
# band; f(vpar) develops the Landau plateau at +-Vp ~ 0.1c DRIVEN BY m1
# ONLY — the clean two-channel separation test.

[grid]
nx = 4096
ny = 1
Lx = 204.8
Ly = 39.269908169872        # kept identical to the RSM deck (inert at ny=1)

[time]
dt = 0.02
nsteps = 1570000            # t_end = 31400/wpe = 6280/We0 = 1000 tau_g

[field]
model = yee
jfilter = 3
tile_sort = 25              # control: legacy tiled path (gate-proven equivalent)

[plasma]
qm = -1.0
rel = false
noisy = true
seed = 20260724

[background]
wce = 0.2
theta_deg = 0.0             # B0 along x — the RSM inversion

[species cold]
density = 0.8
ppc = 4000
uth = 0.01 0.01 0.01
kappa_v = 4.0

[species warm]
density = 0.2
ppc = 4000
uth = 0.02 0.04 0.04
kappa_v = 1.5

[diagnostics]
probes = 12.8 25.6 38.4

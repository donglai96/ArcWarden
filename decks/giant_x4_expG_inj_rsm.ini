# EXPERIMENT G (2026-08-01): B + injection pancake — upper-band support with
# the element engine untouched.
# Ladder: A/B elements (A=0.52, upper band forbidden) / C,D burst (A=1.5
# uniform: lower band 8x overdriven) / E dose (5.4x still elements, no gap
# claim) / F prodkappa (global reshape -> lower band marginal, UNDER-driven,
# zero elements). Lesson: one analytic shape cannot serve both bands.
#
# G = B's deck with the hot f0 modified ONLY by ADDING a second species —
# the minimal velocity-LOCAL change (raising A_eff at v~0.065c without
# touching v~0.2c is mathematically equivalent to adding a cool anisotropic
# subpopulation there):
#   [species hot]  = B verbatim (engine untouched, incl. ppc 28000)
#   [species hot2] = injection pancake: uth 0.05 / 0.1225 (T_perp/T_par 6),
#                    n = 0.003 (17% of engine, ~6% of hot free energy),
#                    same conecut operator.
# KP calibration (B component fixed): gamma_max = 2.9e-3 = the A/B engine
# value EXACTLY (element regime by construction); upper-band gamma = 0.42x
# lower (subordinate); omega_m = 0.64; global moments T_perp/T_par = 1.55
# ~ B's 1.52. Physical picture: trapped 10-keV population + fresh sub-keV
# injection pancake — the observed configuration (anisotropy at low energy).
#   PREDICT: B's element train persists; element chirps extend past the old
#   0.44-0.46 truncation into 0.5-0.6; any upper-band power subordinate to
#   the lower-band elements. Judged ONLY by valley metric + omega_stop vs
#   controls (no visual gap claims — 08-01 lesson).
# Runner: ./chirp2d <this> <outdir> --ckpt=50000 --ckptseq --noeline

[grid]
nx = 19392
ny = 1
Lx = 5041.92
Ly = 39.269908169872     # = 2*pi/k1 (RSM phase contract)

[time]
dt = 0.15
nsteps = 333333          # t_end = 10000/We0 = 50000/wpe

[field]
model = yee
jfilter = 3
tile_sort = 25           # RSM tiled deposit path (shared m0 + complex m1 tiles)

[plasma]
qm = -1.0
cold_nc = 0.9792         # = 1 - (0.0178 + 0.003)
rel = true
noisy = true
seed = 20260720

[background]
wce = 0.2
profile = dipole
lre = 3326.26            # x4 compressed = 2.5x the x10 baseline 1330.504

[boundary]
x = atmo
nd = 500
numax = 0.1
batm = 7.4057            # = b_wall: wall IS the loss cone

[antenna]
amp = 0.0

[rsm]
enable = true
k1 = 0.16                # 15 deg WNA at chirp-onset kpar ~ 0.58 (w = 0.25 We0)

[species hot]
density = 0.0178         # B verbatim — the proven element engine
ppc = 28000
uth = 0.19783565 0.24390817 0.24390817
rep = fullf
dist = conecut
cone_b = 7.4057          # alpha_LC,eq = 21.6 deg

[species hot2]
density = 0.003          # injection pancake: upper-band feeder
ppc = 8000               # cold-parallel confinement -> markers focus at eq
uth = 0.05 0.1225 0.1225
rep = fullf
dist = conecut
cone_b = 7.4057          # same loss-cone operator

[diagnostics]
# lat:     -35     -30     -25     -20     -15    -12.5  -10    -7.5   -5     -2.5  0    (x4 arcs)
probes = -2186.5 -1852.3 -1522.7 -1201.1 -888.9 -736.5 -586.2 -437.8 -291.0 -145.2 0.0 145.2 291.0 437.8 586.2 736.5 888.9 1201.1 1522.7 1852.3 2186.5

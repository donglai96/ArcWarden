# Case II parameters at x5 dipole compression (lre doubled vs the x10
# baseline chen2026_case2_giant.ini). Runner: ./chirp2d <this> <outdir> --fullf
#
# PURPOSE: test the element-repetition-period prediction T_rep ~ T_b/2
# proportional to lre. Baseline (x10, lre=1330.504) measured 850-900/We0
# early; x5 predicts ~1700-1900/We0. Same latitude range (lambda +-26.6 deg,
# wall mirror ratio 2.47), so the domain length doubles: nx = 10000.
# ppc HALVED to 55000 to keep 425M markers inside the 32 GB card; shot-noise
# floor rises sqrt(2) to ~7e-5 (still far below saturation).
# Probes at lambda = 0, +-5, +-10, +-15 deg BOTH hemispheres (per-element
# north/south preference statistics).

[grid]
nx = 10000
ny = 1
Lx = 2600.0
Ly = 0.26

[time]
dt = 0.15
nsteps = 500000          # t_end = 15000/We0 = 75000/wpe (>= 5-6 predicted periods)

[field]
model = yee
jfilter = 3
tile_sort = 25             # mandatory at this ppc (flat atomics collapse)

[plasma]
qm = -1.0
cold_nc = 0.9822         # ne0 - nh (total wpe^2 = 1)
rel = true
noisy = true
seed = 20260721

[background]
wce = 0.2
profile = dipole
lre = 2661.008           # x5-compressed dipole: 2x the x10 baseline

[boundary]
x = hybrid
nd = 300                 # same 78 c/wpe honest absorber as the giant runs
numax = 0.1

[antenna]
amp = 0.0                # self-seeding from shot noise

[species hot]
density = 0.0178
ppc = 55000              # 425M markers total (see header)
uth = 0.19783565 0.24390817 0.24390817
rep = fullf
dist = losscone
rho = 1.0
kappa = 0.3

[diagnostics]
probes = -711.1 -469.0 -232.8 0.0 232.8 469.0 711.1   # lat -15..+15 deg

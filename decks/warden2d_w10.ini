# W10 — first-light rung of the reborn 2D instrument (PLAN_2D_REBORN §4).
# Line-dipole at L0 = l_re = 1330.5 (the ×10 geometry: same equatorial
# gradient scale as the Chen2026/lurepro 1D family → 1D↔2D paired runs are
# controlled). Two δf species: keV engine + sub-keV shelf (the UB fuel
# question is a per-species ledger readout, not an inference).
# Fits the 5090 with margin; the ×4/×1 rungs are THIS deck with L0 and box
# scaled (PLAN_2D_REBORN §4 table), nothing else.

[domain]
lam_w_deg = 50        # wall latitude: mirror ratio sec^2(50°) = 2.42
margin    = 60
# dx = 0.25 is what the res/UB hard gate demands (0.75 Ωe_local at 45° WNA,
# |λ| ≤ 20°): the whistler k rises toward the resonance cone, and 0.35-class
# grids are exactly where the Lu-group series lost its upper band.
dx = 0.25
dz = 0.25

[background]
profile = linedipole
B0eq    = 0.2         # ωpe/Ωe,eq = 5
L0      = 1330.5      # = l_re (×10)

[time]
dt     = 0.10         # CFL(c=1): 0.999·0.25/√2 = 0.177
nsteps = 0            # staged-gate ladder sets this per phase

[cold]
nc = 0.978
c  = 1.0
nonlinear = 0         # cascade arm flips this to 1 (with full-f cross-check)

[boundary]
absorber_cells = 240
runway_lam_deg = 40   # absorber lives in λ ∈ [40°, 50°] — outside the runway

[diag]
target_band_max = 0.75  # resolve UB to 0.75 Ωe(local) ...
target_wna_deg  = 45    # ... at WNA up to 45° ...
target_lam_deg  = 20    # ... wherever |λ| ≤ 20° (UB observational domain)

[species engine]
deltaf   = 1
dist     = 0          # bimax (losscone=1, prodkappa=2 land with P2 dlnf0)
n0       = 0.012
uthpar   = 0.14       # cold-parallel Lu-morph lesson: keep the low-f corridor shut
uthperp  = 0.30
shell_L0 = 1330.5
shell_dL = 40
ppc      = 100        # markers-per-area held vs the dx=0.35 sizing (δf noise
                      # tracks markers/area, not markers/cell)

[species shelf]
deltaf   = 1
dist     = 0
n0       = 0.005      # 0.1–2.6 keV UB shelf; (n2, A2) ladder per PLAN_UB_1D Step 1
uthpar   = 0.045
uthperp  = 0.075      # ρ⊥/dz < 2: WARN-class for δf (V1 hold gate confirms;
                      # full-f shelf arms need dz ≤ 0.1 — priced, not hidden)
shell_L0 = 1330.5
shell_dL = 40
ppc      = 50

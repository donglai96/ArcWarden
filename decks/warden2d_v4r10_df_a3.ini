# V4R10-DF-A3 — the FROZEN-CRITERIA clean-element science run (first
# post-review production attempt; V4R9 was shakedown + G4).
# Code state: gyrotropic loader (u_y local width), time-centred delta-f
# weights, gc_pos momentum contract, hole-tail representation gate —
# all review blockers fixed and regression-green (orbit 23/23, sparse
# 10/10, ckpt 3/3, V1/V1b hold, cold dispersion).
# Design from V4R9 measurements: saturation onset ~155k steps; STOP at
# 195k (onset + 40k = the clean-element window, wd_rms <= 0.2
# throughout); probe_L2 = 4030 covers off-L0 column selection (V4R8).
# SHELL WIDENED after the V4R9 interface analysis (user 2026-08-19:
# edge power > core beyond |lam| 6deg, cross-L modulation at 4.5
# L-units set by source geometry): dL 60->90 (8.3 par wavelengths),
# edge 8->15 (gentler gain roll-off, less edge diffraction); markers
# x1.6 -> 5.9e8, ~25.6 GB, ~100 ms/step.
#
# FROZEN CRITERIA (pre-registered BEFORE launch, 2026-08-19):
#   C1 elements: >= 5 discrete rising elements in the reassigned
#      spectrogram of the onset window, visible on BOTH probe lines;
#   C2 rates: per-element ridge fits in the onset window (elements
#      separated, no overlap contamination) within factor 2 of the
#      Omura S=-0.4 optimum at the per-window measured Bw;
#   C3 gap morphology: spectral valley at 0.45-0.55 wce_local present
#      in >= 3 probes across BOTH lines during the element phase;
#   C4 delta-f health: wd_rms < 0.25 and frac(|wd|>3) < 0.5% at stop.
# Any criterion failing is REPORTED as failing — no post-hoc gate edits.
# taud = 0 ALWAYS (H1/H2 discriminator ruling).

[domain]
lam_w_deg = 50
x_min     = 2500
active_Lmin = 3300
active_Lmax = 4700
margin    = 60
dx = 0.25
dz = 0.25

[background]
profile = dipole2d
B0eq    = 0.2
L0      = 4000

[time]
dt     = 0.15
nsteps = 195000

[cold]
nc = 0.99
c  = 1.0
nonlinear = 0

[boundary]
absorber_cells = 240
runway_lam_deg = 25

[diag]
target_band_max = 0.75
target_wna_deg  = 45
target_lam_deg  = 20
snap_every      = 10000
energy_every    = 100
probe_every     = 4
probe_L2        = 4030
fv_every        = 20000
dens_init       = 1

[species engine]
deltaf   = 1
rel      = 1
dist     = 0
n0       = 0.010
uthpar   = 0.141
uthperp  = 0.282
shell_L0 = 4000
shell_dL = 90
edge_dL  = 15
ppc      = 100

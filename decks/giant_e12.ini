# x10 canonical Case II GIANT + detector pack (2026-07-27): rerun of
# chen2026_case2_giant.ini (identical physics/seed/scale) with eline/jline/
# probe_e + 17 probes, to map WHERE/HOW whistlers are generated at x10
# (threshold-gated single risers) as the DIRECT counterpart to l5_diag
# (x5, refill-gated complexes). Same J.E-ledger + Poynting analysis.
#
# Detector pack (needs the 07-27 chirp2d eline/jline/probe_e build):
#   eline+bline  -> Poynting S_x = EyBz-EzBy source/direction map
#   jline (HOT J) x eline -> J.E ledger (JyEy+JzEz cyclotron, JxEx Landau;
#                J.E<0 = generation)
#   17 probes at lat 0,+-2.5..+-15,+-20,+-25 deg (arc s(lambda), lre=1330.504;
#                +-25 deg = +-609.1 sits INSIDE the Umeda layer edge 572 =
#                layer-input monitor, same role as l5_diag)
#   --ckpt=25000 (750/We0) + watcher -> fuel gauge + carving-fraction map
# Runner: ./chirp2d <this> <outdir> --fullf --ckpt=25000
# Compare directly against build/l5_diag_* products. Archived x10 twin
# (no detectors): build/chen2026_case2_giant.

[grid]
nx = 5000
ny = 1
Lx = 1300.0
Ly = 0.26

[time]
dt = 0.15
nsteps = 83334          # t_end = 2500/We0 = 12500/wpe (elements 1 & 2 only)

[field]
model = yee
jfilter = 3
tile_sort = 25             # mandatory at ppc=110000

[plasma]
qm = -1.0
cold_nc = 0.9822
rel = true
noisy = true
seed = 20260720          # SAME seed as archived giant (statistical twin)

[background]
wce = 0.2
profile = dipole
lre = 1330.504           # x10 compressed

[boundary]
x = hybrid
nd = 300
numax = 0.1

[antenna]
amp = 0.0

[species hot]
density = 0.0178
ppc = 110000             # 425M markers (GPU limit)
uth = 0.19783565 0.24390817 0.24390817
rep = fullf
dist = losscone
rho = 1.0
kappa = 0.3

[diagnostics]
# lat:     -25    -20    -15    -12.5  -10    -7.5   -5     -2.5  0
probes = -609.1 -480.4 -355.6 -294.6 -234.5 -175.1 -116.4 -58.1 0.0 58.1 116.4 175.1 234.5 294.6 355.6 480.4 609.1

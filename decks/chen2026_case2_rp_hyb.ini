# REFRESH+PRECIP giant arm on the CANONICAL case2_giant base (HYBRID walls) —
# per user 2026-07-27: same setup as chen2026_case2_giant.ini (x = hybrid,
# nd = 300, numax = 0.1), ppc = 110000, plus shell bath + real precipitation
# (docs/REFRESH_DESIGN.md precip section). Only delta vs the giant deck is the
# [refresh] block. The damping-base variant (chen2026_case2_rp.ini) is NOT run.
# Runner: ./chirp2d <this> <outdir> --fullf --ppc=110000 --ckpt=50000
# Judge: element train endless + ACF period stationary (giant baseline: 894/We0),
# precip pulses in refresh.csv correlated with elements, ghost fraction
# percent-level, A(x,t) drain from ckpt series vs closed arm.

[grid]
nx = 5000
ny = 1
Lx = 1300.0
Ly = 0.26

[time]
dt = 0.15
nsteps = 333333          # t_end = 10000/We0 = 50000/wpe

[field]
model = yee
jfilter = 3
tile_sort = 25           # mandatory at giant ppc (flat-path atomics: 52x slower — learned twice, 07-26)

[plasma]
qm = -1.0
cold_nc = 0.9822
rel = true
noisy = true
seed = 20260720

[background]
wce = 0.2
profile = dipole
lre = 1330.504

[boundary]
x = hybrid
nd = 300
numax = 0.1

[antenna]
amp = 0.0

[species hot]
density = 0.0178
ppc = 800
uth = 0.19783565 0.24390817 0.24390817
rep = fullf
dist = losscone
rho = 1.0
kappa = 0.3

[diagnostics]
probes = -233.0 -116.4 0.0 116.4 233.0

[refresh]
enable = true
lambda_deg = 15.0
shell = 15.0
precip = true

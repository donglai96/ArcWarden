# Lu source reproduction (2026-08-07, PLAN_LUMORPH.md phase 3 fallback —
# both x4 Lu-morphs FAILED the t2000 stop rule as broadband floods):
# reproduce Lu et al. 2019 JGR (10.1029/2019JA026586) source conditions in
# our proven x10 giant box. Their setup (docs/WHY_NO_060_ELEMENTS.md §1):
# L=0.6RE topology -> lre~1131 c/wpe (ours: 1330.504, closest geometry we
# have), wpe/We=5, nh/nc=0.01, T_perp/T_par=6 (A=5), beta_par=0.01 ->
# u_par=0.141c, u_perp=0.3454c, pure biMaxwellian (NO loss cone),
# absorbing waves + reflecting particles = our x=hybrid boundary.
# = giant_e12.ini with deltas: density 0.0178->0.010 (cold_nc 0.990),
# uth -> (0.141, 0.3454), dist losscone->bimax, nsteps -> t4000/We0.
# QUESTION (phase-3 wording): can the code produce 0.55-0.65 elements at
# Lu's parameters? Judge with scripts/lumorph_gate.py (same 8 bars + t2000
# stop rule; expected corridor: low-f CLOSED B_th(0.25)=1.05e-2 > B_opt,
# elements born 0.3-0.4 with B_opt headroom 4-6e-3 at 0.55-0.65).
# Runner: ./chirp2d <this> <outdir> --ckpt=100000 --noeline

[grid]
nx = 5000
ny = 1
Lx = 1300.0
Ly = 0.26

[time]
dt = 0.15
nsteps = 133334          # t_end = 4000/We0 (Lu-repro pilot, PLAN_LUMORPH phase 3)

[field]
model = yee
jfilter = 3
tile_sort = 25             # mandatory at ppc=110000

[plasma]
qm = -1.0
cold_nc = 0.990
rel = true
noisy = true
seed = 20260720          # SAME seed as archived giant (statistical twin)

[background]
wce = 0.2
profile = dipole
lre = 1330.504           # x10 compressed

[boundary]
x = hybrid
nd = 300
numax = 0.1

[antenna]
amp = 0.0

[species hot]
density = 0.010
ppc = 110000             # 425M markers (GPU limit)
uth = 0.141 0.345378 0.345378
rep = fullf
dist = bimax

[diagnostics]
# lat:     -25    -20    -15    -12.5  -10    -7.5   -5     -2.5  0
probes = -609.1 -480.4 -355.6 -294.6 -234.5 -175.1 -116.4 -58.1 0.0 58.1 116.4 175.1 234.5 294.6 355.6 480.4 609.1

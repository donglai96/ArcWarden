# EXPERIMENT T0 (2026-08-02, rsm-tao17 branch): control arm of the GRL17+RSM
# pair. = decks/chirping_2dpath.ini (the M4 Tao GRL17 port: delta-f + parabolic
# B0 + Umeda hybrid layers + equatorial triggering antenna, unit conversion in
# that deck's header) with ONLY infrastructure additions:
#   tile_sort = 25 (M9 tiled deposit — the flat path is ~8x slower)
#   [diagnostics] probes at h = -80,-40,0,+40,+80 c/Oce (x5 -> c/wpe): the
#   paper's three-latitude spectrogram stations + ridge-fit station h=+80.
# Partner: tao17_rsm.ini = THIS DECK + Ly=2pi/k1 + [rsm] — nothing else.
# Expected (TAO2017_REPRODUCTION.md, chirp1d run 8): rising-tone element
# 0.25 -> 0.7 wce, chirp rate ~4.2e-4 wce^2, element window t ~ 3000-10000/wce
# (x5 in wpe time). The element CROSSES 0.5 wce with NO gap in this parallel
# model — that smooth crossing is the null against which T1 is judged
# (valley metric + omega_stop only; no visual claims).
# Runner: ./chirp2d <this> <outdir> --ckpt=50000 --ckptseq

[grid]
nx = 6560
ny = 1
Lx = 1640.0
Ly = 0.25

[time]
dt = 0.1
nsteps = 500000          # T = 1e4/Oce = 5e4/wpe

[field]
model = yee
tile_sort = 25

[plasma]
qm = -1.0
cold_nc = 0.994
rel = true
noisy = true
seed = 20260803

[background]
wce = 0.2
profile = parabolic
a = 3.448e-6
# xc defaults to Lx/2

[boundary]
x = hybrid
nd = 300
numax = 0.1

[antenna]
amp = 1.0e-4      # dB_trig/B0 ~ 1e-3 at the antenna (calibrated 2026-07-18)
x0 = 3280         # cells: equator
sigma = 4
w0 = 0.05         # 0.25 wce
trmp = 250
toff = 2500

[species hot]
density = 0.006
ppc = 4096
uth = 0.2 0.53 0.53
rep = deltaf

[diagnostics]
# h (c/Oce): -80  -40   0   +40  +80   -> offsets in c/wpe
probes = -400.0 -200.0 0.0 200.0 400.0

# P3-TRIG — delta-f triggered-chirping pilot (the decisive O2 experiment,
# WHY_NO_CLEAN_ELEMENTS §5-A, adapted to the delta-f mainline 2026-08-20).
# Geometry = x10-equivalent Lu corridor (L0 = 1086, lre_eff = 1330 — the
# 1D-proven clean-element regime). Representation = delta-f + trigger
# antenna (Tao17 recipe: delta-f has no spontaneous emission, the antenna
# injects the embryo explicitly). Gauss closure ON (gated 2026-08-20).
#
# Trigger frequency 0.30 wce_eq (w0 = 0.06): the corridor is OPEN there
# (B_th(0.30) = 3.5e-3 < B_opt = 8.4e-3) while 0.25 is threshold-closed
# (B_th = 1.2e-2) — injecting at 0.25 would just decay. amp = 2e-4 from
# the gz_mon calibration point (3e-4 continuous → 1.3e-2 at ±5°; shorter
# toff=800 drive should land the packet at the few-1e-3 B_th crossing).
#
# FROZEN READOUTS (pre-registered before launch):
#   P-A1 placement: packet visible at ±5° probes by t ≈ 1000 with
#        dB/B0eq in 3e-3..8e-3 (above B_th(0.30), below/near B_opt).
#   P-A2 DECISION (the experiment): after toff the packet either
#        (i) sweeps UP 0.30 → ≥0.40 with non-decaying amplitude
#            → 2D corridor physics intact, production run justified; or
#        (ii) decays convectively with no upsweep
#            → lateral escape wins even above threshold → geometry/duct
#              redesign BEFORE any long run (WHY_NO §5-C), reported as-is.
#   P-A3 validity: gauss_res < 1e-5, wdrms < 0.25 (healthy() enforced),
#        no runaway/ucap/drop counters.
# Runner: ./build/warden2d decks/warden2d_p3_trig.ini build/p3_trig --ckpt=5000

[domain]
lam_w_deg = 50
x_min     = 679
active_Lmin = 896
active_Lmax = 1276
margin    = 60
dx = 0.25
dz = 0.25

[background]
profile = dipole2d
B0eq    = 0.2
L0      = 1086
prebalance = 0

[time]
dt     = 0.15
nsteps = 25000
seed   = 20260820

[cold]
nc = 0.990
c  = 1.0
nonlinear = 0

[boundary]
absorber_cells = 240
runway_lam_deg = 25

[diag]
target_band_max = 0.75
target_wna_deg  = 45
target_lam_deg  = 20
snap_every      = 5000
energy_every    = 100
probe_every     = 4
probe_L2        = 1110
fv_every        = 5000
dens_init       = 1
gauss_clean_every = 20

[species engine]
deltaf   = 1
rel      = 1
dist     = 0
n0       = 0.010
uthpar   = 0.141
uthperp  = 0.345         # A = T_perp/T_par - 1 = 4.99 (Lu 2019)
wdrms_max = 0.25

shell_L0 = 1086
shell_dL = 48
edge_dL  = 6
ppc      = 100

[antenna]
amp   = 2e-4
w0    = 0.06
sigma_L = 6
sigma_z = 8
trmp  = 200
toff  = 800

# EXPERIMENT T1 (2026-08-02, rsm-tao17 branch): GRL17 triggered element + RSM.
# = tao17_ctrl.ini with EXACTLY two changes (the "only add rsm" contract):
#   Ly = 2*pi/k1 (RSM phase contract; at ny=1 Ly is otherwise inert)
#   [rsm] k1 = 0.16, seed = 1e-5
# k1 = 0.16: 15 deg WNA at chirp-onset kpar ~ 0.58 (w = 0.25 wce) — same
# dispersion as the x4 arms (wpe/wce = 5 identical), so the x4 k1 carries over.
# seed: div-free B1z-only noise, |B1|/B0 = 1e-5 per node, white in k_par.
# MANDATORY here: delta-f weights start at 0, so the m = 1 system has no
# shot-noise floor to ignite from (full-f self-seeds; delta-f cannot).
# HYPOTHESIS (RSM_MODEL_DEFINITION.md): the parallel chirping element crossing
# 0.5 wce + a weak oblique m=1 channel -> self-generated power deficit at
# 0.5 wce. T0 shows the smooth crossing (no gap, Tao's published result);
# verdict = quantitative valley metric + omega_stop statistics T1 vs T0.
# NO visual gap claims (08-01 lesson).
# Runner: ./chirp2d <this> <outdir> --ckpt=50000 --ckptseq

[grid]
nx = 6560
ny = 1
Lx = 1640.0
Ly = 39.269908169872     # = 2*pi/k1 (RSM phase contract)

[time]
dt = 0.1
nsteps = 500000          # T = 1e4/Oce = 5e4/wpe

[field]
model = yee
tile_sort = 25

[plasma]
qm = -1.0
cold_nc = 0.994
rel = true
noisy = true
seed = 20260718

[background]
wce = 0.2
profile = parabolic
a = 3.448e-6
# xc defaults to Lx/2

[boundary]
x = hybrid
nd = 300
numax = 0.1

[antenna]
amp = 1.0e-4      # dB_trig/B0 ~ 1e-3 at the antenna (calibrated 2026-07-18)
x0 = 3280         # cells: equator
sigma = 4
w0 = 0.05         # 0.25 wce
trmp = 250
toff = 2500

[rsm]
enable = true
k1 = 0.16                # 15 deg WNA at chirp-onset kpar ~ 0.58 (w = 0.25 wce)
seed = 1e-5              # div-free B1z m=1 seed, amplitude/wce (delta-f needs it)

[species hot]
density = 0.006
ppc = 4096
uth = 0.2 0.53 0.53
rep = deltaf

[diagnostics]
# h (c/Oce): -80  -40   0   +40  +80   -> offsets in c/wpe
probes = -400.0 -200.0 0.0 200.0 400.0

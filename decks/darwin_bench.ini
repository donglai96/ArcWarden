# Darwin-branch benchmark at eaw_case7 scale (paper: Darwin vs full-EM cost).
# Same grid + particle load as eaw_case7 (625^2, ppc 400 = 156.25M markers,
# anisotropic uth, B0 = 0.25 wpe x̂), but the Darwin field model has no light
# CFL: dt = 0.1 wpe^-1 vs the Yee 0.0145 (6.9x fewer steps per physical time).
# No diagnostics — pure step-rate measurement (override nsteps on the CLI).
#   ./arcwarden decks/darwin_bench.ini out --nsteps=N

[grid]
nx = 625
ny = 625
Lx = 13.5
Ly = 13.5

[time]
dt = 0.1
nsteps = 400
dump_every = 1000000

[diagnostics]
enable = em_energy
prefix = darwin_bench

[plasma]
qm = -1.0
eps0 = 1.0
noisy = true
seed = 20260714

[field]
model = darwin
c = 1.0
ndc = 2

[background]
wce = 0.25
theta_deg = 0

[species electrons]
density = 1.0
ppc = 400
uth = 0.01678 0.03752 0.03752
ufl = 0 0 0

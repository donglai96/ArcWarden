# x10 R_m calibration k16 (PLAN_LUMORPH A5.4 / user exec order step 4):
# = lurepro_x10.ini + [rsm] k1=0.16 + Ly=2pi/k1, nsteps -> t2000/Oe.
# Purpose: measure R_m = 2|B1|rms/|B0w|rms in the element window on the
# x10/Lu source — the x4 mapping (k16/k24/k32 -> 0.97/0.44/0.19) does NOT
# carry over (different kpar spectrum: kpar ~ 0.8-1.0 wpe/c at 0.4-0.5 We
# here vs 0.58 at x4). MAIN-case rule: pick k1 with measured R_m ~ 0.2-0.4
# (weak E-par channel); R_m ~ 1 = mode-competition regime, unusable.
# Runner: ./chirp2d <this> <outdir> --ckpt=0 --noeline

[grid]
nx = 5000
ny = 1
Lx = 1300.0
Ly = 39.269908169872     # = 2*pi/k1 (RSM phase contract, k1=0.16)

[time]
dt = 0.15
nsteps = 66667           # t_end = 2000/We0 (R_m calibration: covers the burst + early element window)

[field]
model = yee
jfilter = 3
tile_sort = 25             # mandatory at ppc=110000

[plasma]
qm = -1.0
cold_nc = 0.990
rel = true
noisy = true
seed = 20260720          # SAME seed as archived giant (statistical twin)

[background]
wce = 0.2
profile = dipole
lre = 1330.504           # x10 compressed

[boundary]
x = hybrid
nd = 300
numax = 0.1

[rsm]
enable = true
k1 = 0.16
ledger = true            # A0 J1E1 kinetic/fluid split (cheap, 4 doubles)

[antenna]
amp = 0.0

[species hot]
density = 0.010
ppc = 110000             # 425M markers (GPU limit)
uth = 0.141 0.345378 0.345378
rep = fullf
dist = bimax

[diagnostics]
# lat:     -25    -20    -15    -12.5  -10    -7.5   -5     -2.5  0
probes = -609.1 -480.4 -355.6 -294.6 -234.5 -175.1 -116.4 -58.1 0.0 58.1 116.4 175.1 234.5 294.6 355.6 480.4 609.1

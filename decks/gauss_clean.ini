# P1 — 2D x10-equivalent Lu reproduction (CHIRPING_DIAGNOSIS_2026-08-19 §5).
# The proven-clean 1D recipe (lurepro_x10: full-f + Lu f0 + lre 1330) moved
# into the true-2D dipole2d geometry at the SAME effective inhomogeneity:
#   2D  B/Beq ~ 1 + 3 (s/L0)^2  ==  1D  1 + 4.5 (s/lre)^2
#   =>  lre_eff = sqrt(1.5) * L0  =>  L0 = 1330.5/sqrt(1.5) = 1086.
# Geometry = V4R10 scaled by 1086/4000 = 0.2715; drive = Lu 2019 f0
# (nh = 0.010, uthpar = 0.141, A = 5), FULL-F (the only representation with
# spontaneous emission — HOT_REP_ROUND1.md ruling; delta-f stays empty
# without an antenna). ppc = 800 (3.1e8 markers ~ 11 GB).
#
# FROZEN PREDICTIONS (from the 1D twin + Omura corridor, BEFORE launch):
#   F1 corridor gate: B_th(0.25) = 1.2e-2 > B_opt -> low band CLOSED below
#      ~0.28; elements BORN at 0.30-0.40 wce_eq (not at 0.2).
#   F2 discrete rising elements by t <= 2000/We_eq (= 10000/wpe), climbing
#      to 0.55-0.70 wce_eq at the off-equator probes (lurepro: 0.5->0.68).
#   F3 saturation |dB|/B0eq ~ 1e-2 class (1D: 8.7e-3); NOT a broadband
#      flood (W10-style occupancy stays element-like).
#   F4 natural upper/lower structure: power dip between the climbing
#      element top and the linear band (1D twin: up/hi = 75, V = 0.87).
# Any prediction failing is REPORTED as failing.
# Runner: ./build/warden2d decks/warden2d_p1_lurepro2d.ini build/p1_lurepro2d \
#             --nsteps=200000 --ckpt=20000

[domain]
lam_w_deg = 50
x_min     = 679
active_Lmin = 896
active_Lmax = 1276
margin    = 60
dx = 0.25
dz = 0.25

[background]
profile = dipole2d
B0eq    = 0.2
L0      = 1086
prebalance = 0

[time]
dt     = 0.15
nsteps = 8000

[cold]
nc = 0.990
c  = 1.0
nonlinear = 0

[boundary]
absorber_cells = 240
runway_lam_deg = 25

[diag]
target_band_max = 0.75
target_wna_deg  = 45
target_lam_deg  = 20
snap_every      = 0
energy_every    = 100
probe_every     = 4
probe_L2        = 1110   # outer flat-top edge (ridge lesson)
                         # selects the outer full-density column)
fv_every        = 20000
dens_init       = 1
gauss_clean_every = 20

[species engine]
deltaf   = 1
rel      = 1
dist     = 0
n0       = 0.010
uthpar   = 0.141
uthperp  = 0.345         # A = T_perp/T_par - 1 = 4.99 (Lu 2019)

shell_L0 = 1086
shell_dL = 48            # flat-top = 5.0 par wavelengths (>= 5.5-rule, user 08-19)
edge_dL  = 6
ppc      = 100

[antenna]
amp   = 3e-4
w0    = 0.05
sigma_L = 6
sigma_z = 8
trmp  = 200
toff  = 1500


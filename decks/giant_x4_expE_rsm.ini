# EXPERIMENT E (2026-08-01). Ladder: A = giant_x4_atmo40 (elements, no rsm),
# B = giant_x4_atmo40_rsm (elements + k_perp), C = giant_x4_u2band_rsm
# (two-band f0 + k_perp: GAP seen, elements NOT distinct — one violent burst
# t700-2000, A burns 1.5 -> 0.88), D = giant_x4_u2band_ctrl (C without rsm:
# filled spectrum, no gap -> gap attribution to k_perp CLOSED).
#
# E = C with EXACTLY ONE knob turned SLIGHTLY (user directive 2026-08-01:
# approach the burst->element transition FROM C's working side, small steps):
# hot density 0.0178 -> 0.012 (cold_nc adjusted). uth untouched -> A = 1.5
# (= T_perp/T_par 2.5, same value C always had), marginal frequency 0.60,
# two-band coverage identical to C. gamma scales linearly with n_h: C's
# drive was 2.33e-2 = 8x the proven element engine (A/B at 2.9e-3); E lands
# at 1.57e-2 = 5.4x. First attempt (0.0045 = 2x, ABORTED t6000) over-cut by
# my regime guess and produced sub-element mush — lesson: no data exists
# between 2x and 8x, so walk down gently.
#   PREDICT: burst decomposes into discrete/repeating elements spanning both
#   bands, 0.5 valley persists (per-element omega_stop + ckptseq imaging).
#   Ladder: still one burst -> 0.008; mush again -> transition is sharp,
#   bisect 0.009.
# Runner: ./chirp2d <this> <outdir> --ckpt=50000 --ckptseq --noeline
#   (--ckptseq = C's lesson: single ckpt.bin overwrite made in-burst plateau
#   unverifiable; 6 unique ckpts here, ~12 GB each)

[grid]
nx = 19392
ny = 1
Lx = 5041.92
Ly = 39.269908169872     # = 2*pi/k1 (RSM phase contract)

[time]
dt = 0.15
nsteps = 333333          # t_end = 10000/We0 = 50000/wpe

[field]
model = yee
jfilter = 3
tile_sort = 25           # RSM tiled deposit path (shared m0 + complex m1 tiles)

[plasma]
qm = -1.0
cold_nc = 0.988          # = 1 - n_h (was 0.9822 in C)
rel = true
noisy = true
seed = 20260720

[background]
wce = 0.2
profile = dipole
lre = 3326.26            # x4 compressed = 2.5x the x10 baseline 1330.504

[boundary]
x = atmo
nd = 500
numax = 0.1
batm = 7.4057            # = b_wall: wall IS the loss cone

[antenna]
amp = 0.0

[rsm]
enable = true
k1 = 0.16                # 15 deg WNA at chirp-onset kpar ~ 0.58 (w = 0.25 We0)

[species hot]
density = 0.012          # THE one knob, turned SLIGHTLY: 0.0178 -> 0.012
                         # (gamma_max 8x -> 5.4x A/B; band coverage untouched)
ppc = 36000              # +29% vs A-D's 28000 (user 08-01): ~485M markers
                         # after conecut taper, ~22 GB — noise amp -14%
uth = 0.19783565 0.31283 0.31283
rep = fullf
dist = conecut
cone_b = 7.4057          # alpha_LC,eq = 21.6 deg

[diagnostics]
# lat:     -35     -30     -25     -20     -15    -12.5  -10    -7.5   -5     -2.5  0    (x4 arcs)
probes = -2186.5 -1852.3 -1522.7 -1201.1 -888.9 -736.5 -586.2 -437.8 -291.0 -145.2 0.0 145.2 291.0 437.8 586.2 736.5 888.9 1201.1 1522.7 1852.3 2186.5

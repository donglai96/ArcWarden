# V4R4 — compact-box geometry (user 2026-08-18): inner-x cut at 2500
# (particle wall where the lines exit, lambda ~ 31 deg, mirror ratio 2.1)
# + active L band [3300,4700]. 2.4x fewer cells than V4R3; with sparse
# tile storage the field memory drops further. Physics trade recorded:
# shorter runway (arc ~2100) and larger equivalent loss cone (~43 deg)
# in exchange for concentrating all compute on the equatorial source
# region (V4 gates live at |lambda| <= 20 deg).
# V4R3 header follows:
# V4R3 — V4R2 + (i) RELATIVISTIC push (rel=1: the A-tail is relativistic,
# nonrel push produced 0.09%/step superluminal clamps by t=13500 — V4R2
# stopped; device gamma-chain validated device==host to 5e-5) and
# (ii) A = 5 -> 3 (u_perp 0.345 -> 0.282, T_perp/T_par = 4; user call:
# gentler first test, softer relativistic tail, closer to reality).
# Original V4R2 header:
# V4R2 — ppc retune of V4R (user, 2026-08-18): L0 4400->4000 buys
# ppc 60->100 at constant memory. markers/lambda^2 = 9.5e4 = 1.7x Lu 2019
# = the legacy-2D-flagship statistics level; l_re = 2309 (x5.8) is still
# the least-compressed 2D chorus run. Phase-space structures (trapping
# islands, plateau) get the statistics the nonlinear stage needs.
# Original V4R header:
# V4R — "as real as the GPU allows" chirping run (user directive 2026-08-18).
# dipole2d background (TRUE 3D-dipole meridional line shapes, Beq ~ L^-3,
# mirror profile = real x cos^3(lam) — the irreducible planar-2D factor),
# pushed to the 32 GB memory limit: L0 = 4400 -> equatorial l_re = 2540
# = x5.2 compression. The LEAST-compressed 2D chorus simulation attempted
# (Lu 2019: x12; Ke: similar; our V4a circle family: x10). B_th ~ lre^-4:
# threshold ~13x lower than the x10 family; the full-f shot-noise floor
# sits ~17x above B_th(0.25) -> vigorous threshold-crossed ignition.
# f0 kept at the Lu-morph anchor (u_par 0.141c, A=5) so the (geometry,
# lre) axis moves alone; the A-reduction ladder toward realistic A~1 is
# the pre-registered follow-up at this lre.
# Cost: ~24 GB, ~140 ms/step, t = 6000/Omega_e = 200k steps ~ 8 h
# (overnight; --ckpt=20000, resumable, tail-watchable).

[domain]
lam_w_deg = 50
x_min     = 2500   # user cut 2026-08-18: wall moves to lambda ~ 31 deg
active_Lmin = 3300 # field updates only in the wave band
active_Lmax = 4700
margin    = 60
dx = 0.25
dz = 0.25

[background]
profile = dipole2d
B0eq    = 0.2
L0      = 4000

[time]
dt     = 0.15
nsteps = 200000

[cold]
nc = 0.99
c  = 1.0
nonlinear = 0

[boundary]
absorber_cells = 240
runway_lam_deg = 25   # inside the ~31 deg effective wall

[diag]
target_band_max = 0.75
target_wna_deg  = 45
target_lam_deg  = 20
snap_every      = 20000
energy_every    = 500

[species engine]
deltaf   = 0
rel      = 1
dist     = 0
n0       = 0.010
uthpar   = 0.141
uthperp  = 0.282
shell_L0 = 4000
shell_dL = 40
ppc      = 100

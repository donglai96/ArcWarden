# P4-EL1 — PRODUCTION ARM-1: clean single triggered chirping element.
# Follows the p3_trig pilot PASS (2026-08-20: upsweep 0.30 -> 0.45+ local,
# element survives to +-20 deg at ~6e-3, gauss_res 2.1e-6, wdrms 0.17).
# Change vs pilot: THRESHOLD-level trigger — amp 2e-4 -> 1e-4 (pilot hit
# B_opt 8.4e-3 while still driven; the drive and the element mixed in the
# spectrogram), toff 800 -> 600. The element must now form from a compact
# near-threshold seed (expected ~4e-3 at +-5 deg, B_th(0.30) = 3.5e-3)
# and sweep on its own. Run to t = 6000 (wdrms projection stays below the
# 0.25 representation gate, pilot trend ~3e-5/unit from 0.17 at 3750).
#
# FROZEN READOUTS (pre-registered):
#   P-B1 seed: dB/B0eq at +-5 deg in 3e-3..6e-3 at t ~ 800.
#   P-B2 ELEMENT: single riser 0.30 -> >= 0.45 Omega_e_local, ridge
#        instantaneous width < 0.10 Omega_e (N=1024 STFT), monotonic.
#   P-B3 propagation: >= 3e-3 sustained at +-10 deg; visible at +-20 deg.
#   P-B4 validity: wdrms < 0.25 throughout, gauss_res < 1e-5, healthy.
#   Failure of any = reported as failing; no re-runs without a design change.
# Runner: ./build/warden2d decks/warden2d_p4_el1.ini build/p4_el1 --ckpt=10000

[domain]
lam_w_deg = 50
x_min     = 679
active_Lmin = 896
active_Lmax = 1276
margin    = 60
dx = 0.25
dz = 0.25

[background]
profile = dipole2d
B0eq    = 0.2
L0      = 1086
prebalance = 0

[time]
dt     = 0.15
nsteps = 40000
seed   = 20260820

[cold]
nc = 0.990
c  = 1.0
nonlinear = 0

[boundary]
absorber_cells = 240
runway_lam_deg = 25

[diag]
target_band_max = 0.75
target_wna_deg  = 45
target_lam_deg  = 20
snap_every      = 5000
energy_every    = 100
probe_every     = 4
probe_L2        = 1110
fv_every        = 5000
dens_init       = 1
gauss_clean_every = 20

[species engine]
deltaf   = 1
rel      = 1
dist     = 0
n0       = 0.010
uthpar   = 0.141
uthperp  = 0.345         # A = T_perp/T_par - 1 = 4.99 (Lu 2019)
wdrms_max = 0.25

shell_L0 = 1086
shell_dL = 48
edge_dL  = 6
ppc      = 100

[antenna]
amp   = 1e-4
w0    = 0.06
sigma_L = 6
sigma_z = 8
trmp  = 200
toff  = 600

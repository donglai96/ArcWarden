# G2.2 v2 — Ke/Gao/Lu/Wang 2017 JGR (doi:10.1002/2017JA024178) 2D mirror
# chorus, ArcWarden version. Their Eq.1 field = our b0_prof=3 EXACTLY
# (B_par = B0(1+xi s^2), B_perp = -2 xi s y B0). Their setup (Table 1):
# xi = 3.45e-6/rho_e0^2, box s = +-500 rho_e0, transverse +-700 rho_e0,
# wpe/We = 5, COLD = massless fluid, hot nh = 1%, Tperp/Tpar = 4.5,
# beta_par = 0.01 (w_par = 0.141c), relativistic hot push, absorbing wave
# boundaries + reflecting particles, full-f ~500 ppc, dt = 0.02/We.
# rho_e0 = w_par/We = 0.705 c/wpe -> xi = 6.94e-6 (c/wpe)^-2; our grid
# dx = 0.345 (their 0.49 rho_e0), dy = 0.966 (their 1.37 rho_e0).
# DEVIATIONS (documented): transverse half-width (+-247 vs their +-493,
# 5090 memory); y periodic (theirs absorbing; background By wrap jump
# affects a ~0.6% straddler layer, elastic); jfilter=3 (they document no
# smoothing). Their targets: onset We*t ~ 400, elements ~1e-2 B0, chirping
# Gamma = 3.5-7.7e-4 We^2, WNA < 25 deg. Run: 150000 steps = 3000/We.
# Runner: ./mirror2d <this> <outdir>   (~4.2e8 hot markers, ~21 GB)

[grid]
nx = 2048
ny = 512
Lx = 706.56
Ly = 494.59

[time]
dt = 0.1
nsteps = 150000

[field]
model = yee
cold_model = full
jfilter = 3
tile_sort = 25

[plasma]
qm = -1.0
rel = true
noisy = true
seed = 20260724
cold_nc = 0.99

[background]
wce = 0.2
profile = mirror2d
a = 6.94e-6

[boundary]
x = damping

[species hot]
density = 0.01
ppc = 400
uth = 0.141 0.299 0.299

[diagnostics]
probes = -176.68 0.02 176.62   # OFFSETS from b0_xc (P0-2 convention change)

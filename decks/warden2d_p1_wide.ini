# P1-WIDE (O1, 2026-08-19) — Lu-faithful broad source. P1 v2 verdict: waves
# plateau at 1-2e-3 B0eq = 2x BELOW Omura B_th(0.3) — the nonlinear corridor
# was never entered. Lu 2019's own 2D (same f0, same lre-class) reached
# 3-4e-2 with a hot region ~190 c/wpe across; our 48+36 duct leaks the wave
# obliquely before threshold. O1 = widen the source to the Lu class:
#   dL 48 -> 180 (= 18.8 lambda_par; flat top L 996-1176, envelope 978-1194,
#   82 L-units inside the active band), ppc 600 -> 280 (8.0e8 markers ~29 GB).
# O4 applied: fv_vmax/fv_uqmax now deck keys (0.6/1.2 — the 0.35/0.5
# defaults clipped Lu's u_perp rms 0.49 and faked A_eff = 1.76).
# probe_L2 -> 1176 (new outer flat-top edge). prebalance dent adapts
# automatically (same -p_perp/B0 = -5.95e-3 depth, wider footprint).
#
# FROZEN EXPECTATIONS (before launch):
#   E1 envelope crosses B_th(0.3) = 3.5e-3 B0eq (the v2 blocker);
#   E2 after crossing, discrete structures in 0.25-0.5 — morphology judged
#      BY THE USER, not by me;
#   E3 emission stays band-limited (no broadband flood 0.1-0.9);
#   E4 dent static at t=0 value, wave gauges = detrended probes only.
# Runner: ./build/warden2d decks/warden2d_p1_wide.ini build/p1_wide \
#             --nsteps=200000 --ckpt=20000

[domain]
lam_w_deg = 50
x_min     = 679
active_Lmin = 896
active_Lmax = 1276
margin    = 60
dx = 0.25
dz = 0.25

[background]
profile = dipole2d
B0eq    = 0.2
L0      = 1086
prebalance = 1

[time]
dt     = 0.15
nsteps = 200000          # t = 30000/wpe = 6000/We_eq

[cold]
nc = 0.990
c  = 1.0
nonlinear = 0

[boundary]
absorber_cells = 240
runway_lam_deg = 25

[diag]
target_band_max = 0.75
target_wna_deg  = 45
target_lam_deg  = 20
snap_every      = 250    # f2d every 7.5/We_eq; sline every 62 steps
energy_every    = 100
probe_every     = 4
probe_L2        = 1176   # outer flat-top edge
fv_every        = 20000
fv_vmax         = 0.6    # O4: covers uthpar 0.141 tail + resonant range
fv_uqmax        = 1.2    # O4: u_perp rms 0.49 needs >= 1.0
dens_init       = 1

[species engine]
deltaf   = 0             # FULL-F
rel      = 1
dist     = 0
n0       = 0.010
uthpar   = 0.141
uthperp  = 0.345         # A = 5 (Lu 2019)
shell_L0 = 1086
shell_dL = 180           # 18.8 lambda_par — Lu-class broad source
edge_dL  = 6
ppc      = 280

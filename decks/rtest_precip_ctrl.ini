# R-TEST C: damping + refresh + precip — whistler-packet reflection off the x boundary in the REAL
# chen-case2 plasma (cold fluid 98% + hot losscone 2%, dipole B0).
# Antenna fires 0.25 We0 for ~4 cycles from the equator; R read from the
# x-t bline map (incident vs returning striation amplitude).
[grid]
nx = 5000
ny = 1
Lx = 1300.0
Ly = 0.26

[time]
dt = 0.15
nsteps = 60000           # R test: t = 9000/wpe = 1800/We0

[field]
model = yee
jfilter = 3
tile_sort = 25           # mandatory at giant ppc (flat-path atomics: 52x slower — learned twice, 07-26)

[plasma]
qm = -1.0
cold_nc = 0.9822
rel = true
noisy = true
seed = 20260720

[background]
wce = 0.2
profile = dipole
lre = 1330.504

[boundary]
x = damping
nd = 300
numax = 0.1

[antenna]
amp = 0.0             # pulse: 4 cycles of 0.25 We0 from the equator
x0 = 2500
sigma = 4
w0 = 0.05
trmp = 100
toff = 600

[species hot]
density = 0.0178
ppc = 800
uth = 0.19783565 0.19783565 0.19783565   # ISOTROPIC: no growth, clean R
rep = fullf

[diagnostics]
probes = -520.0 -440.0 -350.0 0.0 350.0 440.0 520.0

[refresh]
enable = true
lambda_deg = 15.0
shell = 15.0
precip = true

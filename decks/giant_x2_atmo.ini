# LRE-SCAN x2 ATMO (2026-07-30): realistic-boundary arm. Same geometry as
# giant_x2_hybrid (exact x5 spatial scaling of giant_e12: wall lat +-26.3 deg,
# f0/seed/densities identical) but the boundary operator is the NEW bnd_x=3
# "atmo" mode, which decouples the wall's two jobs:
#   WAVE absorber: Umeda mask on fields + cold fluid (98.2% of the wave
#     current; the mode-2 R~1 rationale came from a MARKER-cold test and does
#     not apply here). nd=300 (78 c/wpe, several whistler wavelengths — the
#     proven absorber width; the layer is NOT a loss-cone device any more).
#   PARTICLE wall = atmosphere-class loss cone: specular with u_perp KEPT
#     (adiabatic return from virtual mirror point beyond the wall),
#     precipitate ONLY sin2(a_local) < b_local/batm -> u_perp = 0 return
#     (mu=0 ghost flux ~ cone-only, u_perp energy deleted = atmospheric
#     deposition; u_par returned -- half-sink, perturbative at this flux).
#     batm=33 -> eq cone 10 deg: same "pump-off" class as the literal L=5
#     value (batm=230 -> 3.8 deg) since both << f0 hole edge ~34 deg, but
#     with a measurable precipitation channel (vs hybrid's artificial 44
#     deg = 16x more pitch space carved).
# Gates (07-30): atmo(batm=1e12) == damping statistically; batm=3 drains wall
# u_perp 28% -> criterion fires with right sign/magnitude.
#
# Causality window unchanged: earliest wall-return ~3200/We0; elements before
# t~3000 cannot involve ANY boundary-processed particle. With the realistic
# boundary the anisotropy pump is OFF: elements here = genuinely equatorial.
# Runner: ./chirp2d <this> <outdir> --ckpt=25000

[grid]
nx = 25000
ny = 1
Lx = 6500.0
Ly = 0.26

[time]
dt = 0.15
nsteps = 166667         # t_end = 5000/We0 = 25000/wpe

[field]
model = yee
jfilter = 3
tile_sort = 25

[plasma]
qm = -1.0
cold_nc = 0.9822
rel = true
noisy = true
seed = 20260720

[background]
wce = 0.2
profile = dipole
lre = 6652.52            # x2 compressed = 5x the x10 baseline 1330.504

[boundary]
x = atmo
nd = 300                 # pure wave absorber (78 c/wpe); loss cone set by batm,
numax = 0.1              # NOT by the layer position
batm = 33.0              # eq loss cone 10 deg (local cut at wall 15.6 deg).
                         # Design rule: cone must be << f0 hole edge (~34 deg)
                         # so the boundary is NOT an anisotropy pump (hybrid's
                         # 44 deg was); 10 deg carves 1/16 of hybrid's pitch
                         # space yet gives a measurable precip channel earlier
                         # than the literal L=5 value (batm=230 -> 3.8 deg,
                         # same pump-off class -- available by knob). Timescale
                         # note: compressed box already samples the wall 2x
                         # faster than reality; exact-cone realism is moot.

[antenna]
amp = 0.0

[species hot]
density = 0.0178
ppc = 22000              # 550M markers (GPU limit), = e12's total
uth = 0.19783565 0.24390817 0.24390817
rep = fullf
dist = losscone
rho = 1.0
kappa = 0.3

[diagnostics]
# lat:     -25     -20     -15     -12.5   -10     -7.5    -5     -2.5   0   (x5 of e12)
probes = -3045.5 -2402.0 -1778.0 -1473.0 -1172.5 -875.5 -582.0 -290.5 0.0 290.5 582.0 875.5 1172.5 1473.0 1778.0 2402.0 3045.5
